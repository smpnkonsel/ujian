<style>
.kw-halaman{
  --bg:var(--nm-bg); --ink:var(--nm-text); --muted:var(--nm-muted); --hi:var(--nm-light); --lo:var(--nm-dark);
  --biru:var(--nm-accent); --hijau:var(--nm-ok); --kuning:var(--nm-kuning); --merah:var(--nm-warn); --abu:var(--nm-muted);
  --garis:var(--nm-garis);
  --out:6px 6px 14px var(--lo),-6px -6px 14px var(--hi);
  --in:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi);
  font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
}
.kw-halaman,.kw-halaman *{box-sizing:border-box;margin:0}
.kw-halaman button,.kw-halaman input,.kw-halaman select{font:inherit;color:inherit}
.kw-halaman :focus-visible{outline:3px solid var(--biru);outline-offset:3px;border-radius:14px}
.kw-halaman .hidden{display:none!important}

/* Mepet sidebar, jarak kanan kecil */
.kw-halaman .wrap{width:auto;max-width:none;margin:0;padding-inline:24px;animation:none}
.kw-halaman main.wrap{padding-block:0 1rem}
.kw-halaman > header{padding-block:1.6rem .8rem;display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:flex-end}
.kw-halaman h1{font-size:clamp(1.6rem,3.5vw,2.2rem);line-height:1.2}
.kw-halaman > header p{color:var(--muted);margin-top:.3rem}
.kw-halaman .aksi{display:flex;gap:.8rem;flex-wrap:wrap}

/* Tombol */
.kw-halaman .muat{border:0;background:var(--bg);box-shadow:var(--out);border-radius:14px;padding:.7rem 1.1rem;font-size:.86rem;font-weight:600;color:var(--biru);cursor:pointer}
.kw-halaman .muat:active{box-shadow:var(--in)}
.kw-halaman .muat:disabled{opacity:.55;cursor:default;box-shadow:var(--in)}
.kw-halaman .kecil{border:0;background:var(--bg);box-shadow:var(--out);border-radius:12px;padding:.35rem .9rem;font-size:.8rem;font-weight:600;color:var(--biru);cursor:pointer;white-space:nowrap}
.kw-halaman .kecil:active{box-shadow:var(--in)}

/* Peringatan */
.kw-halaman #cfgwarn{background:var(--bg);box-shadow:var(--in);border-radius:16px;padding:.8rem 1.1rem;margin:0 0 1rem;color:var(--kuning);font-size:.86rem;font-weight:500}

/* Alat dan filter */
.kw-halaman .alat{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;margin-bottom:.6rem}
.kw-halaman .cari,.kw-halaman select{border:0;background:var(--bg);box-shadow:var(--in);border-radius:16px;padding:.8rem 1.1rem;min-width:0}
.kw-halaman .cari{flex:1;min-width:200px}
.kw-halaman select{cursor:pointer;max-width:100%;flex:1;min-width:160px}
.kw-halaman .lingkup{color:var(--muted);font-size:.84rem;margin-bottom:1.4rem}

/* Panel dan tabel */
.kw-halaman .panel{background:var(--bg);box-shadow:var(--out);border-radius:24px;padding:.6rem 1.2rem 1.2rem;overflow:hidden}
.kw-halaman table{width:100%;border-collapse:collapse;font-size:.88rem}
.kw-halaman th{text-align:left;font-weight:600;color:var(--muted);font-size:.8rem;padding:.9rem .6rem;white-space:nowrap}
.kw-halaman td{padding:.8rem .6rem;border-top:1px solid var(--garis);vertical-align:middle}
.kw-halaman td small{display:block;color:var(--muted);font-size:.76rem}
.kw-halaman td.n,.kw-halaman th.n{text-align:right}

.kw-halaman .empty{text-align:center;color:var(--muted);padding:2rem 1rem}
.kw-halaman .count{margin:1rem 0 2rem;font-size:.8rem;color:var(--muted)}
.kw-halaman > footer{margin-top:auto;padding:1.4rem;text-align:center;font-size:.8rem;color:var(--muted)}

/* Dialog detail jawaban */
.kw-halaman dialog{border:0;border-radius:24px;padding:1.4rem;width:min(640px,94vw);background:var(--bg);color:var(--ink);box-shadow:var(--out)}
.kw-halaman dialog::backdrop{background:rgba(0,0,0,.4)}
.kw-halaman dialog h2{font-size:1.15rem;margin-bottom:.3rem}
.kw-halaman #dInfo{color:var(--muted);font-size:.84rem;margin-bottom:1rem}
.kw-halaman #dGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:.7rem;max-height:50vh;overflow:auto;padding:.4rem}
.kw-halaman #dGrid .sel{border-radius:14px;padding:.45rem .5rem;text-align:center;background:var(--bg);box-shadow:var(--in)}
.kw-halaman #dGrid .sel span{display:block;font-size:.7rem;color:var(--muted)}
.kw-halaman #dGrid .sel b{font-size:.95rem;word-break:break-all}
.kw-halaman #dGrid .sel.kosong b{color:var(--merah)}
.kw-halaman .btns{display:flex;justify-content:flex-end;margin-top:1.2rem}

/* Toast */
.kw-halaman #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg);color:var(--ink);box-shadow:var(--out);font-size:.84rem;font-weight:500;padding:.6rem 1.2rem;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.kw-halaman #toast.on{opacity:1}

/* Tablet */
@media (max-width:820px){
  .kw-halaman .wrap{padding-inline:14px}
}

/* HP: tabel jadi kartu */
@media (max-width:760px){
  .kw-halaman .cari,.kw-halaman select{font-size:16px;min-height:42px;flex:1 1 100%;width:100%}
  .kw-halaman .aksi{width:100%}
  .kw-halaman .aksi .muat{flex:1;min-height:42px}
  .kw-halaman .panel{padding:.4rem 1rem 1rem}

  .kw-halaman thead{position:absolute;left:-9999px}
  .kw-halaman table,.kw-halaman tbody,.kw-halaman tr,.kw-halaman td{display:block;width:100%}
  .kw-halaman tr{padding:.8rem 0;border-top:1px solid var(--garis)}
  .kw-halaman td,.kw-halaman td.n{border:0;padding:.25rem 0;display:flex;justify-content:space-between;align-items:center;gap:1rem;overflow-wrap:anywhere;text-align:right}
  .kw-halaman td::before{content:attr(data-l);color:var(--muted);font-size:.78rem;flex:none;text-align:left}
  .kw-halaman td small{display:inline;margin-left:.4rem}
  .kw-halaman td.aksi-baris::before{content:none}
  .kw-halaman td.aksi-baris .kecil{width:100%;min-height:40px}
}

/* HP kecil */
@media (max-width:380px){
  .kw-halaman .wrap{padding-inline:10px}
}
</style>

</div>

<header class="wrap">
  <div>
    <h1>Jawaban Siswa</h1>

<main class="wrap">
  <div id="cfgwarn" class="hidden" role="alert"></div>

  <div class="alat">

<script type="module">
import { buatPeriode, buatFilterJenis } from '../assets/js/periode.js';
import { petaJenisPaket } from '../assets/js/data.js';
/* =========================================================
   Jawaban Siswa — data dari ../assets/js/firebase-pusat.js
   Menampilkan kode jawaban siswa dari koleksi "hasil"
   (tiga Firebase tingkat VII/VIII/IX), hanya untuk kelas dan
   mata pelajaran yang diajar guru yang sedang login
   (data mengajar dari koleksi "guru" di Firebase Siswa dan Guru).
   Kode: pg/bs = huruf (bs: A=Benar, B=Salah), pgk = huruf-huruf,
   jodoh = nomor pasangan dipisah koma, "-" = tidak dijawab.
========================================================= */
const LOKASI_FIREBASE = '../assets/js/firebase-pusat.js';
const BATAS_PER_TINGKAT = 500;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const urutAlfa = (a, b) => String(a).localeCompare(String(b), 'id', {numeric:true});
const ms = v => !v ? 0 : typeof v === 'number' ? v : v.toMillis ? v.toMillis() : (v.toDate ? v.toDate().getTime() : (new Date(v).getTime() || 0));

/* Kelas dan mapel milik guru (sama dengan halaman Nilai Ujian) */
const normK = v => String(v || '').toUpperCase().replace(/[\s.\-_]/g, '').replace(/^(7|8|9)/, m => ({7:'VII', 8:'VIII', 9:'IX'})[m]);
const paketCocok = (paket, mapel) => String(paket || '').toLowerCase().includes(String(mapel).toLowerCase());
let G = {nama:'', nip:'', mengajar:[]};
const kelasMilik = kelas => G.mengajar.filter(x => x.kelas.some(k => normK(k) === normK(kelas)));
const milikGuru = r => kelasMilik(r.kelas).some(x => paketCocok(r.paket, x.mapel));
let SIS = [];   // siswa dari kelas yang diajar guru (Data Siswa)
const pick = (o, ks) => { for (const k of ks) if (o[k] !== undefined && o[k] !== '') return o[k]; return ''; };
const kelasGuru = () => [...new Set(SIS.map(s => s.kelas))].sort(urutAlfa);
const mapelUntuk = kelas => [...new Set(G.mengajar.filter(x => !kelas || x.kelas.some(k => normK(k) === normK(kelas))).map(x => x.mapel))].sort(urutAlfa);

function peringatan(teks){
  const w = $('cfgwarn');
  w.classList.remove('hidden');
  const p = document.createElement('div');
  p.textContent = teks;
  w.appendChild(p);
}
let tmToast;
function toast(teks){
  const t = $('toast'); t.textContent = teks; t.classList.add('on');
  clearTimeout(tmToast); tmToast = setTimeout(() => t.classList.remove('on'), 2200);
}
function unduhCsv(nama, baris){
  const teks = baris.map(b => b.map(v => {
    const s = String(v ?? '');
    return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + teks], {type:'text/csv;charset=utf-8'}));
  a.download = nama;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* Dokumen "hasil" -> baris tabel. Sesuaikan nama field di sini bila berbeda. */
function norm(id, x, tingkat){
  return {
    id, tingkat, paketId: x.paketId || '',
    nama: x.nama || x.nis || '(tanpa nama)',
    nis: x.nis || '',
    kelas: x.kelas || '',
    paket: x.paket || x.paketNama || x.ujian || x.judul || x.mapel || '(tanpa judul)',
    benar: x.benar, salah: x.salah, kosong: x.kosong,
    nilai: x.nilai ?? x.skor,
    jawaban: typeof x.jawaban === 'string' ? x.jawaban : Array.isArray(x.jawaban) ? x.jawaban.join('|') : '',
    waktu: ms(x.selesai || x.waktu || x.dikumpulkan || x.dibuat)
  };
}

/* Data mengajar guru yang sedang login */
async function dataGuru(FP){
  const kosong = {nama:'', nip:'', mengajar:[]};
  try {
    const auth = FP.FIREBASE_PUSAT.SISWA_GURU.auth;
    await auth.authStateReady();
    const u = auth.currentUser;
    if(!u || !u.email) return kosong;
    const kolGuru = (FP.KOLEKSI && FP.KOLEKSI.guru) || 'guru';
    const q = await FP.F.getDocs(FP.F.query(FP.F.collection(FP.dbSiswaGuru, kolGuru), FP.F.where('akunEmail', '==', u.email.toLowerCase()), FP.F.limit(1)));
    if(!q.docs[0]) return {...kosong, nama: u.displayName || ''};
    const dok = q.docs[0].data(), id = q.docs[0].id;
    const pecahT = t => String(t || '').split(/[,;]/).map(x => x.trim()).filter(Boolean);
    const arr = Array.isArray(dok.mengajar) ? dok.mengajar : (dok.mapel ? [{mapel: dok.mapel, kelas: pecahT(dok.kelas)}] : []);
    const mengajar = arr.map(x => ({mapel: String(x.mapel || '').trim(), kelas: (Array.isArray(x.kelas) ? x.kelas : pecahT(x.kelas)).map(k => String(k).trim())})).filter(x => x.mapel);
    return {nama: dok.nama || u.displayName || '', nip: dok.nip || id, mengajar};
  } catch(e){ console.warn('data guru gagal dibaca', e); return kosong; }
}

let rows = [];

function pecah(r){
  if(!r.jawaban) return [];
  return r.jawaban.includes('|') ? r.jawaban.split('|') : (r.jawaban.includes(',') && !/^[A-F-]+(,[A-F-]+)*$/.test(r.jawaban) ? [r.jawaban] : r.jawaban.split(''));
}

function fillSelect(sel, label, values){
  const cur = sel.value;
  sel.innerHTML = `<option value="">${label}</option>` + values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  sel.value = values.includes(cur) ? cur : '';
}

const cocokKelas = (r, k) => !k || normK(r.kelas) === normK(k);

function saring(){
  const u = $('fUjian').value, k = $('fKelas').value, m = $('fMapel').value, q = $('q').value.trim().toLowerCase();
  return rows.filter(r => JF.cocok(r.jenis) && (!u || r.paket === u) && cocokKelas(r, k) && (!m || paketCocok(r.paket, m)) &&
    (!q || (r.nama + ' ' + r.nis).toLowerCase().includes(q)))
    .sort((a, b) => urutAlfa(a.paket, b.paket) || urutAlfa(a.kelas, b.kelas) || urutAlfa(a.nama, b.nama));
}

/* Isi pilihan kelas dan mapel milik guru; bila hanya satu, langsung terpilih */
function isiKelasMapel(){
  const kl = kelasGuru();
  fillSelect($('fKelas'), 'Semua kelas saya', kl);
  if(!$('fKelas').value && kl.length === 1) $('fKelas').value = kl[0];
  isiMapel();
}
function isiMapel(){
  const mp = mapelUntuk($('fKelas').value);
  fillSelect($('fMapel'), 'Semua mapel saya', mp);
  if(!$('fMapel').value && mp.length === 1) $('fMapel').value = mp[0];
}

function render(){
  const k = $('fKelas').value, m = $('fMapel').value;
  fillSelect($('fUjian'), 'Semua ujian', [...new Set(rows.filter(r => cocokKelas(r, k) && (!m || paketCocok(r.paket, m))).map(r => r.paket))].sort(urutAlfa));
  const list = saring();

  $('lingkup').textContent = 'Menampilkan ' + (k ? 'kelas ' + k : 'semua kelas yang Anda ajar') + ' · ' + (m ? m : 'semua mapel yang Anda ajar') + '.';

  $('isi').innerHTML = list.map(r => `<tr data-id="${esc(r.id)}" data-t="${esc(r.tingkat)}">
      <td data-l="Siswa"><span>${esc(r.nama)}<small>NIS ${esc(r.nis || '–')}</small></span></td>
      <td data-l="Kelas">${esc(r.kelas)}</td>
      <td data-l="Ujian">${esc(r.paket)}</td>
      <td class="n" data-l="Benar / Salah / Kosong">${r.benar ?? '–'} / ${r.salah ?? '–'} / ${r.kosong ?? '–'}</td>
      <td class="n" data-l="Nilai"><b>${r.nilai ?? '–'}</b></td>
      <td class="aksi-baris"><button type="button" class="kecil" aria-label="Lihat jawaban ${esc(r.nama)}">Lihat jawaban</button></td></tr>`).join('');

  $('kosong').classList.toggle('hidden', list.length > 0);
  $('kosong').textContent = rows.length ? 'Tidak ada data yang cocok.' : 'Belum ada siswa yang mengumpulkan ujian pada kelas dan mapel Anda pada periode ' + PER.label() + '. Ganti periode di atas bila perlu.';
  $('jml').textContent = list.length + ' dari ' + rows.length + ' pengumpulan';
}

function detail(r){
  const j = pecah(r);
  $('dJudul').textContent = r.nama + ' — ' + r.paket;
  $('dInfo').textContent = 'NIS ' + (r.nis || '–') + ' · Kelas ' + r.kelas + ' · Nilai ' + (r.nilai ?? '–') +
    ' · Benar ' + (r.benar ?? '–') + ', salah ' + (r.salah ?? '–') + ', kosong ' + (r.kosong ?? '–');
  $('dGrid').innerHTML = j.length
    ? j.map((v, i) => `<div class="sel ${v === '-' ? 'kosong' : ''}"><span>${i + 1}</span><b>${esc(v)}</b></div>`).join('')
    : '<p>Jawaban tidak tersimpan untuk pengumpulan ini.</p>';
  $('dlg').showModal();
}

async function muat(){
  const FP = await import(LOKASI_FIREBASE);
  const {F, dbTingkat, TINGKAT, KOLEKSI} = FP;
  const kol = (KOLEKSI && KOLEKSI.hasil) || 'hasil';

  G = await dataGuru(FP);
  if(!G.mengajar.length){
    SIS = []; rows = []; isiKelasMapel(); render();
    throw new Error('Data mengajar untuk akun guru ini tidak ditemukan di Data Guru.');
  }

  // daftar kelas dari Data Siswa: hanya kelas yang diajar guru dan ada siswanya
  const boleh = new Set(G.mengajar.flatMap(x => x.kelas).map(normK));
  const snapS = await (await import('../assets/js/cache.js')).ambilCache('siswa', 30, async () => (await F.getDocs(F.query(F.collection(FP.dbSiswaGuru, (KOLEKSI && KOLEKSI.siswa) || 'siswa'), F.limit(2000)))).docs.map(d => ({ id: d.id, ...d.data() }))).then(a => ({ docs: a.map(o => ({ id: o.id, data: () => o })) }));
  SIS = snapS.docs.map(x => {
    const r = x.data(), kelas = String(pick(r, ['kelas'])).trim();
    return {kelas, tingkat: FP.tingkatDariKelas(kelas)};
  }).filter(s => s.kelas && s.tingkat && boleh.has(normK(s.kelas)));
  isiKelasMapel();

  // baca hanya tingkat (VII/VIII/IX) dari kelas yang ada siswanya
  const tg = new Set(SIS.map(s => String(s.tingkat)));
  const target = TINGKAT.filter(t => tg.has(String(t)));
  if(!target.length){ rows = []; render(); return; }

  /* Hanya hasil pada periode terpilih yang dibaca (terbaru dulu), bukan seluruh data lama. */
  const pr = PER.rentang();
  const bacaPeriode = async t => {
    const ref = F.collection(dbTingkat(t), kol);
    const w = [];
    if(pr.dari) w.push(F.where('waktu', '>=', F.Timestamp.fromDate(pr.dari)));
    if(pr.sampai) w.push(F.where('waktu', '<', F.Timestamp.fromDate(pr.sampai)));
    try{ return await F.getDocs(F.query(ref, ...w, F.orderBy('waktu', 'desc'), F.limit(BATAS_PER_TINGKAT))); }
    catch(e){ console.warn('Filter periode gagal, memakai tanpa filter:', e); return F.getDocs(F.query(ref, F.limit(BATAS_PER_TINGKAT))); }
  };
  const hasil = await Promise.allSettled(target.map(bacaPeriode));
  const terpotong = hasil.map((h, i) => h.status === 'fulfilled' && h.value.size >= BATAS_PER_TINGKAT ? target[i] : null).filter(Boolean);
  if(terpotong.length) peringatan('Periode ini berisi lebih dari ' + BATAS_PER_TINGKAT + ' hasil di kelas ' + terpotong.join(', ') + '; sebagian belum tampil. Persempit periode.');

  const baru = [], gagal = [];
  hasil.forEach((h, i) => {
    if(h.status === 'fulfilled') h.value.docs.forEach(d => baru.push(norm(d.id, d.data(), target[i])));
    else { gagal.push(target[i]); console.warn(kol, target[i], h.reason); }
  });
  if(gagal.length === target.length) throw new Error('semua tingkat gagal dimuat. Periksa aturan Firestore atau koneksi.');
  if(gagal.length) peringatan('Koleksi "' + kol + '" tingkat ' + gagal.join(', ') + ' gagal dimuat. Periksa aturan Firestore atau koneksi.');

  // hanya kelas milik guru, dengan ujian yang namanya memuat mapel yang ia ajar di kelas itu
  rows = baru.filter(milikGuru).sort((a, b) => (b.waktu || 0) - (a.waktu || 0));
  const JN = await petaJenisPaket();
  rows.forEach(r => { r.jenis = JN.get(r.paketId) || ''; });
  JF.isi(rows.map(r => r.jenis));
  render();
}

$('isi').onclick = e => {
  const tr = e.target.closest('tr'); if(!tr) return;
  const r = rows.find(x => x.id === tr.dataset.id && x.tingkat === tr.dataset.t);
  if(r) detail(r);
};
$('tutup').onclick = () => $('dlg').close();
$('fKelas').addEventListener('change', () => { isiMapel(); render(); });
['fMapel', 'fUjian'].forEach(id => $(id).addEventListener('change', render));
$('q').addEventListener('input', render);
$('btnMuat').onclick = () => {
  const b = $('btnMuat');
  b.disabled = true;
  $('cfgwarn').innerHTML = ''; $('cfgwarn').classList.add('hidden');
  muat().then(() => toast('Data dimuat ulang.')).catch(e => peringatan(String(e.message || e))).finally(() => { b.disabled = false; });
};
$('btnCsv').onclick = () => unduhCsv('jawaban-siswa.csv', [
  ['NIS', 'Nama', 'Kelas', 'Ujian', 'Nilai', 'Jawaban'],
  ...saring().map(r => [r.nis, r.nama, r.kelas, r.paket, r.nilai, pecah(r).join(' ')])
]);

const JF = buatFilterJenis($('q').parentElement, { kunci: 'jawaban-guru', onUbah: () => render() });
const PER = buatPeriode($('q').parentElement, { kunci: 'jawaban', bawaan: 'bulan-ini', tanpa: ['mendatang'], onUbah: () => muat().catch(e => peringatan(String(e.message || e))) });
try { await muat(); }
catch(e){ console.error(e); peringatan('Jawaban gagal dimuat: ' + (e.message || e.code || e)); render(); }
