<style>
/* Halaman Data Siswa (guru) · KW Learning (responsif)
   Warna, tombol, isian, dan dialog mengikuti neumorph.css.
   Di sini hanya tata letak dan hal khusus halaman ini. */

:root {
  --dt-aksen: var(--nm-accent);
  --dt-redup: var(--nm-muted);
  --dt-bahaya: var(--nm-warn);
  --dt-ok: var(--nm-ok);
  --dt-warn-bg: color-mix(in srgb, var(--nm-kuning) 16%, var(--nm-bg));
  --dt-warn-teks: var(--nm-kuning);
}

/* ---------- Tata letak: mepet sidebar, jarak kanan kecil ---------- */
.isi {
  max-width: none;
  margin: 0;
  padding: 20px 24px calc(40px + env(safe-area-inset-bottom, 0px));
}

.atas {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 18px;
}
.atas h1 { margin: 0 0 4px; font-size: 1.6rem; line-height: 1.2; }
.atas p { margin: 0; color: var(--dt-redup); font-size: .9rem; }
#rinci { margin-top: 2px; }

.alat { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.isi > .alat { margin-bottom: 16px; }
.alat input[type="search"] { flex: 1 1 220px; width: auto; min-width: 0; }
.alat select { flex: 0 1 180px; width: auto; min-width: 0; }

/* ---------- Ukuran kontrol (tampilan dari neumorph.css) ---------- */
button { min-height: 40px; padding: 8px 16px; }
button.kecil { min-height: 32px; padding: 4px 12px; font-size: .85rem; }
button.bahaya { color: var(--dt-bahaya); }
input, select { min-height: 40px; width: 100%; }

/* ---------- Peringatan konfigurasi ---------- */
.warn {
  margin: 0 0 14px;
  padding: 10px 14px;
  background: var(--dt-warn-bg);
  color: var(--dt-warn-teks);
  font-size: .9rem;
}

/* ---------- Tabel ---------- */
.k {
  background: var(--nm-bg);
  border: 0;
  border-radius: 22px;
  box-shadow: var(--nm-out);
}
.tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 22px; }

table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px 16px; text-align: left; vertical-align: middle; }
thead th {
  position: sticky;
  top: 0;
  background: var(--nm-bg);
  color: var(--dt-redup);
  font-size: .8rem;
  font-weight: 600;
  white-space: nowrap;
  border-bottom: 1px solid var(--nm-garis);
}
tbody tr + tr td { border-top: 1px solid var(--nm-garis); }
td.nis { font-variant-numeric: tabular-nums; white-space: nowrap; }
td.nama { font-weight: 600; }
td.aksi { text-align: right; white-space: nowrap; }
td.aksi button + button { margin-left: 8px; }
td.kosong { text-align: center; color: var(--dt-redup); padding: 32px 14px; }

.lencana {
  display: inline-block;
  min-width: 26px;
  padding: 2px 10px;
  border-radius: 999px;
  text-align: center;
  font-size: .82rem;
  background: var(--nm-bg);
  box-shadow: var(--nm-in-s);
}

/* ---------- Dialog ---------- */
dialog { width: min(460px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); padding: 0; overflow: auto; }
dialog form { padding: 22px; }
dialog h2 { margin: 0 0 14px; font-size: 1.2rem; }

.f { margin-bottom: 14px; }
.f label { display: block; margin-bottom: 6px; font-size: .85rem; color: var(--dt-redup); }
.f small { display: block; margin-top: 4px; font-size: .78rem; }
.baris { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.gf {
  margin: 0 0 12px;
  padding: 8px 12px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--nm-warn) 12%, var(--nm-bg));
  color: var(--dt-bahaya);
  font-size: .88rem;
}
.tombol { display: flex; justify-content: flex-end; gap: 10px; padding-top: 6px; }

/* Dialog konfirmasi (tengah layar) */
.konfirm { width: min(380px, calc(100vw - 32px)); text-align: center; }
.kbox { padding: 24px 22px 20px; }
.kbox h2 { margin: 0 0 8px; font-size: 1.15rem; }
.kbox p { margin: 0 0 20px; color: var(--dt-redup); white-space: pre-line; }
.konfirm .tombol { justify-content: center; }
.konfirm .tombol button { min-width: 96px; }
button.utama.merah { color: var(--dt-bahaya) !important; }

/* ---------- Toast: di tengah layar ---------- */
#toast {
  position: fixed;
  inset: auto;
  left: 50%;
  top: 50%;
  bottom: auto;
  margin: 0;
  transform: translate(-50%, -50%);
  width: max-content;
  max-width: min(420px, calc(100vw - 32px));
  padding: 16px 24px;
  font-size: .95rem;
  text-align: center;
  z-index: 2000;
  opacity: 1;
  transition: none;
  animation: toast-masuk .18s ease-out;
}
#toast.ok  { color: var(--dt-ok); }
#toast.err { color: var(--dt-bahaya); }
@keyframes toast-masuk {
  from { opacity: 0; transform: translate(-50%, -46%) scale(.96); }
  to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

/* ---------- Tablet ---------- */
@media (max-width: 820px) {
  .isi { padding: 16px 14px calc(40px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- HP: tabel jadi kartu ---------- */
@media (max-width: 680px) {
  .atas h1 { font-size: 1.35rem; }
  .atas .alat { width: 100%; }
  .atas .alat button { flex: 1 1 auto; }

  .alat input[type="search"], .alat select { flex: 1 1 100%; width: 100%; }
  input, select { font-size: 16px; min-height: 42px; }  /* cegah zoom iOS */
  button { min-height: 42px; }

  .k { background: transparent; box-shadow: none; border-radius: 0; }
  .tbl { overflow: visible; }
  table, tbody, tr, td { display: block; width: 100%; }
  thead { display: none; }

  tbody tr {
    display: flex;
    flex-direction: column;
    margin-bottom: 16px;
    padding: 14px 16px;
    background: var(--nm-bg);
    border-radius: 20px;
    box-shadow: var(--nm-out);
  }
  tbody tr + tr td { border-top: 0; }
  td { padding: 2px 0; overflow-wrap: anywhere; }
  td[data-label]::before {
    content: attr(data-label);
    display: inline-block;
    min-width: 96px;
    color: var(--dt-redup);
    font-size: .8rem;
  }
  td.nama { order: -1; font-size: 1.05rem; margin-bottom: 4px; }
  td.nama::before { display: none; }
  td.kosong { padding: 28px 8px; text-align: center; }
  td.kosong::before { display: none; }

  dialog { width: calc(100vw - 20px); border-radius: 20px; }
  dialog form { padding: 16px; }
  .baris { grid-template-columns: 1fr; }
  .tombol button { flex: 1 1 0; }
}

/* ---------- HP kecil ---------- */
@media (max-width: 380px) {
  .isi { padding: 12px 10px 36px; }
}

/* Guru hanya melihat data master; mengubahnya hanya boleh admin (juga ditegakkan Firestore Rules). */
#templat, #impor, #berkas, #tambah, [data-aksi="ubah"], [data-aksi="hapus"], td.aksi, thead th:last-child { display: none !important; }
</style>

<script type="module">
/*
  Firebase dimuat dengan import dinamis. Jika berkas firebase-pusat.js
  gagal dimuat, tombol-tombol lain tetap berfungsi dan penyebabnya
  ditampilkan di halaman (bukan hanya di konsol).
*/
let F, dbSiswaGuru;
let KOLEKSI = { guru: "guru", siswa: "siswa" };
let galatMuat = "";

try {
  ({ F, dbSiswaGuru, KOLEKSI } = await import("../assets/js/firebase-pusat.js"));
} catch (e) {
  console.error("firebase-pusat.js gagal dimuat:", e);

  galatMuat = location.protocol === "file:"
    ? "Halaman dibuka langsung dari berkas (file://), sehingga Firebase tidak bisa dimuat. Buka lewat server atau hosting (mis. localhost atau Firebase Hosting)."
    : "Gagal memuat assets/js/firebase-pusat.js (" + (e && e.message ? e.message : e) + "). Pastikan berkas itu ada di assets/js/ dan mengekspor F, dbSiswaGuru, dan KOLEKSI.";
}

(() => {
  "use strict";

  /* =====================================================
     1. KONFIGURASI
  ===================================================== */

  const $ = (id) => document.getElementById(id);

  const NAMA_KOLEKSI = KOLEKSI.siswa;

  // Berkas templat yang diunduh (kolom: NIS/NISN, Nama lengkap, Kelas, L/P, Agama).
  const NAMA_TEMPLAT = "Template_Data_Siswa.xlsx";
  const URL_TEMPLAT = "../assets/templat/" + NAMA_TEMPLAT;
  const SHEET_DATA = "Data Siswa";

  // Pustaka pembaca Excel (SheetJS): coba salinan lokal dulu, lalu CDN.
  const SUMBER_XLSX = [
    "../assets/js/xlsx.full.min.js",
    "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
  ];

  const AGAMA = [
    "Islam",
    "Kristen",
    "Katolik",
    "Hindu",
    "Buddha",
    "Konghucu"
  ];

  let semua = [];
  let nisUbah = null;
  let berhentiSnapshot = null;
  let timerToast;
  let sedangMemuat = true;

  /* =====================================================
     2. UTILITAS
  ===================================================== */

  const esc = (s) =>
    String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[c]);

  const rapikan = (s) =>
    String(s ?? "").replace(/\s+/g, " ").trim();

  const normKepala = (s) =>
    rapikan(s).toLowerCase().replace(/\s*\/\s*/g, "/");

  // Kelas ditulis angka Romawi: "7a", "VII-A", "VII A" -> "VII A"
  const ROMAWI = { "7": "VII", "8": "VIII", "9": "IX" };

  function normKelas(v) {
    const s = rapikan(v)
      .toUpperCase()
      .replace(/[.\-_]/g, " ")
      .replace(/\s+/g, " ")
      .trim();

    const m = s.match(/^(VII|VIII|IX|7|8|9)\s*([A-Z])$/);

    return m ? `${ROMAWI[m[1]] || m[1]} ${m[2]}` : s;
  }

  // Urutan kelas: VII A, VII B, VIII A, VIII B, IX A, IX B
  const RANK = { VII: 7, VIII: 8, IX: 9 };

  function kunciKelas(k) {
    const m = String(k).match(/^(VII|VIII|IX)\s+(.*)$/);
    return m ? [RANK[m[1]], m[2]] : [99, String(k)];
  }

  const banding = (a, b) =>
    a.localeCompare(b, "id", { numeric: true });

  const urutKelas = (a, b) => {
    const x = kunciKelas(a);
    const y = kunciKelas(b);
    return (x[0] - y[0]) || banding(x[1], y[1]);
  };

  const urut = (a, b) =>
    urutKelas(a.kelas, b.kelas) ||
    a.nama.localeCompare(b.nama, "id");

  function normGender(v) {
    const s = rapikan(v).toLowerCase();

    if ([
      "l", "lk", "laki", "laki-laki",
      "laki laki", "pria", "male", "m"
    ].includes(s)) return "L";

    if ([
      "p", "pr", "perempuan",
      "wanita", "female", "f"
    ].includes(s)) return "P";

    return "";
  }

  function normAgama(v) {
    const s = rapikan(v).toLowerCase();

    const peta = {
      islam: "Islam",
      kristen: "Kristen",
      protestan: "Kristen",
      "kristen protestan": "Kristen",
      katolik: "Katolik",
      katholik: "Katolik",
      "kristen katolik": "Katolik",
      hindu: "Hindu",
      buddha: "Buddha",
      budha: "Buddha",
      konghucu: "Konghucu",
      khonghucu: "Konghucu",
      "kong hu cu": "Konghucu"
    };

    return peta[s] || "";
  }

  function olahSiswa(mentah) {
    const rec = {
      nis: rapikan(mentah.nis).replace(/\s/g, "").replace(/^'/, ""),
      nama: rapikan(mentah.nama),
      kelas: normKelas(mentah.kelas),
      gender: normGender(mentah.gender),
      agama: normAgama(mentah.agama)
    };

    let galat = "";

    if (!/^\d{4,20}$/.test(rec.nis)) {
      galat = "NIS/NISN harus berupa angka 4–20 digit.";
    } else if (rec.nama.length < 2) {
      galat = "Nama lengkap wajib diisi.";
    } else if (!rec.kelas) {
      galat = "Kelas wajib diisi.";
    } else if (!rec.gender) {
      galat = "Jenis kelamin harus L atau P.";
    } else if (!rec.agama) {
      galat = "Agama harus salah satu dari: " + AGAMA.join(", ") + ".";
    }

    return { rec, galat };
  }

  /* Pemberitahuan (toast) di tengah layar, tanpa alert/confirm bawaan browser. */

  const ADA_POPOVER =
    typeof HTMLElement !== "undefined" && "popover" in HTMLElement.prototype;

  function tampilToast(el) {
    if (ADA_POPOVER) {
      if (!el.matches(":popover-open")) el.showPopover();
    } else {
      el.style.display = "block";
    }
  }

  function sembunyiToast(el) {
    if (ADA_POPOVER) {
      try {
        if (el.matches(":popover-open")) el.hidePopover();
      } catch (e) { /* abaikan */ }
    } else {
      el.style.display = "none";
    }
  }

  // Dialog konfirmasi di tengah layar; mengembalikan true/false.
  function konfirmasi(pesan, opsi = {}) {
    const { judul = "Konfirmasi", ya = "Ya", bahaya = false } = opsi;

    return new Promise((selesai) => {
      const dlg = $("dlgk");
      const btnYa = $("kya");
      const btnTidak = $("ktidak");
      let hasil = false;

      $("kjdl").textContent = judul;
      $("kpesan").textContent = pesan;
      btnYa.textContent = ya;
      btnYa.classList.toggle("merah", bahaya);

      const onYa = () => { hasil = true; dlg.close(); };
      const onTidak = () => dlg.close();
      const onLatar = (e) => { if (e.target === dlg) dlg.close(); };

      const bersih = () => {
        btnYa.removeEventListener("click", onYa);
        btnTidak.removeEventListener("click", onTidak);
        dlg.removeEventListener("click", onLatar);
        dlg.removeEventListener("close", bersih);
        selesai(hasil);
      };

      btnYa.addEventListener("click", onYa);
      btnTidak.addEventListener("click", onTidak);
      dlg.addEventListener("click", onLatar);
      dlg.addEventListener("close", bersih);

      dlg.showModal();
      btnTidak.focus();
    });
  }

  function toast(pesan, jenis = "") {
    let el = $("toast");

    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      el.setAttribute("role", "status");

      if (ADA_POPOVER) el.setAttribute("popover", "manual");
      else el.style.display = "none";

      document.body.appendChild(el);
    }

    el.textContent = pesan;
    el.className = jenis;

    tampilToast(el);

    // ulangi animasi bila toast sedang tampil
    el.style.animation = "none";
    void el.offsetWidth;
    el.style.animation = "";

    clearTimeout(timerToast);

    timerToast = setTimeout(() => sembunyiToast(el), 4000);
  }

  function tampilkanPeringatan(teks) {
    const w = $("cfgwarn");

    if (!w) return;

    if (!teks) {
      w.classList.add("hidden");
      return;
    }

    w.textContent = teks;
    w.classList.remove("hidden");
  }

  /* =====================================================
     3. FIREBASE — REALTIME
  ===================================================== */

  function mulaiFirebase() {
    tampilkanPeringatan("");
    return muatSiswa(false);
  }

  /* HEMAT FIRESTORE: daftar siswa dibaca SEKALI (getDocs) lalu disimpan di
     cache bersama (cache.js, 30 menit) yang juga dipakai halaman lain.
     Sebelumnya memakai onSnapshot pada seluruh koleksi: tiap membuka halaman
     membaca semua siswa dan listener terus aktif. Perubahan dari halaman ini
     memperbarui daftar lokal + cache tanpa membaca ulang. */
  let modCache = null;

  const olahDok = (d) => ({
    ...d,
    nis: String(d.id ?? d.nis ?? ""),
    nama: String(d.nama ?? ""),
    // data lama ("VII-A") ditampilkan seragam sebagai "VII A"
    kelas: normKelas(d.kelas)
  });

  async function muatSiswa(paksa) {
    try {
      modCache = modCache || await import("../assets/js/cache.js");

      let mentah = paksa ? null : modCache.bacaCache("siswa", 30);

      if (!mentah) {
        const snap = await F.getDocs(F.collection(dbSiswaGuru, NAMA_KOLEKSI));
        mentah = snap.docs.map((dok) => ({ id: dok.id, ...dok.data() }));
        modCache.tulisCache("siswa", mentah);
      }

      semua = mentah.map(olahDok);

      sedangMemuat = false;

      tampilkanPeringatan("");
      render();

    } catch (error) {
      console.error("Firebase siswa:", error);

      sedangMemuat = false;

      tampilkanPeringatan(
        "Data siswa gagal dimuat. Periksa koneksi dan aturan keamanan Firestore."
      );

      toast("Gagal mengambil data siswa.", "err");
      render();
    }
  }

  async function muatUlang() {
    const tombol = $("muatulang");
    if (tombol) tombol.disabled = true;

    sedangMemuat = true;
    render();

    await muatSiswa(true);

    if (tombol) tombol.disabled = false;
    toast("Data dimuat ulang.", "ok");
  }

  // Simpan daftar lokal ke cache bersama setelah ada perubahan.
  function simpanCacheLokal() {
    if (!modCache) return;

    modCache.tulisCache("siswa", semua.map((s) => {
      const { nis, ...sisa } = s;
      return { ...sisa, id: nis };
    }));
  }

  /* =====================================================
     4. FIREBASE — SIMPAN BANYAK DATA
  ===================================================== */

  async function simpanBanyak(daftar) {
    for (let i = 0; i < daftar.length; i += 450) {
      const batch = F.writeBatch(dbSiswaGuru);

      daftar.slice(i, i + 450).forEach((r) => {
        const ref = F.doc(
          dbSiswaGuru,
          NAMA_KOLEKSI,
          r.nis
        );

        batch.set(ref, {
          ...r,
          diperbaruiPada: F.serverTimestamp()
        });
      });

      await batch.commit();
    }
  }

  /* =====================================================
     5. FIREBASE — UBAH DATA
  ===================================================== */

  async function ganti(nisLama, rec) {
    const batch = F.writeBatch(dbSiswaGuru);

    const refBaru = F.doc(
      dbSiswaGuru,
      NAMA_KOLEKSI,
      rec.nis
    );

    if (nisLama !== rec.nis) {
      const refLama = F.doc(
        dbSiswaGuru,
        NAMA_KOLEKSI,
        nisLama
      );

      batch.delete(refLama);
    }

    batch.set(refBaru, {
      ...rec,
      diperbaruiPada: F.serverTimestamp()
    });

    await batch.commit();
  }

  /* =====================================================
     6. FIREBASE — HAPUS DATA
  ===================================================== */

  async function hapusFirebase(nis) {
    const ref = F.doc(
      dbSiswaGuru,
      NAMA_KOLEKSI,
      nis
    );

    await F.deleteDoc(ref);
  }

  /* =====================================================
     7. FILTER KELAS
  ===================================================== */

  function isiFilterKelas() {
    const fk = $("fk");
    const terpilih = fk.value;

    const daftar = [
      ...new Set(semua.map((s) => s.kelas))
    ].sort(urutKelas);

    fk.innerHTML =
      '<option value="">Semua kelas</option>' +
      daftar.map((k) =>
        `<option value="${esc(k)}">${esc(k)}</option>`
      ).join("");

    fk.value = daftar.includes(terpilih)
      ? terpilih
      : "";

    $("dk").innerHTML = daftar.map((k) =>
      `<option value="${esc(k)}"></option>`
    ).join("");

    return daftar.length;
  }

  /* =====================================================
     8. TABEL DAN STATISTIK
  ===================================================== */

  function render() {
    const jmlKelas = isiFilterKelas();

    const kata = rapikan(
      $("cari").value
    ).toLowerCase();

    const kelas = $("fk").value;

    const tampil = semua
      .filter((s) =>
        (!kelas || s.kelas === kelas) &&
        (
          !kata ||
          s.nama.toLowerCase().includes(kata) ||
          s.nis.includes(kata)
        )
      )
      .sort(urut);

    const laki = semua.filter(
      (s) => s.gender === "L"
    ).length;

    const perempuan = semua.filter(
      (s) => s.gender === "P"
    ).length;

    $("jml").textContent =
      tampil.length === semua.length
        ? `${semua.length} siswa`
        : `${tampil.length} dari ${semua.length} siswa`;

    $("rinci").textContent = semua.length
      ? `Laki-laki ${laki} · Perempuan ${perempuan} · ${jmlKelas} kelas`
      : "Belum ada data siswa";

    if (!tampil.length) {
      const pesan = semua.length
        ? "Tidak ada siswa yang cocok dengan pencarian."
        : sedangMemuat
          ? "Sedang mengambil data dari Firebase..."
          : "Belum ada data siswa. Tambahkan siswa atau impor dari Excel/CSV.";

      $("tb").innerHTML = `
        <tr>
          <td class="kosong" colspan="6">
            ${pesan}
          </td>
        </tr>
      `;

      return;
    }

    $("tb").innerHTML = tampil.map((s) => `
      <tr>
        <td class="nis" data-label="NIS">
          ${esc(s.nis)}
        </td>

        <td class="nama" data-label="Nama">
          ${esc(s.nama)}
        </td>

        <td data-label="Kelas">
          <span class="lencana">
            ${esc(s.kelas)}
          </span>
        </td>

        <td data-label="Jenis Kelamin">
          ${esc(s.gender)}
        </td>

        <td data-label="Agama">
          ${esc(s.agama)}
        </td>

        <td class="aksi">
          <button
            type="button"
            class="kecil"
            data-aksi="ubah"
            data-id="${esc(s.nis)}">
            Ubah
          </button>

          <button
            type="button"
            class="kecil bahaya"
            data-aksi="hapus"
            data-id="${esc(s.nis)}">
            Hapus
          </button>
        </td>
      </tr>
    `).join("");
  }

  /* =====================================================
     9. FORM TAMBAH DAN UBAH
  ===================================================== */

  function bukaForm(siswa = null) {
    nisUbah = siswa ? siswa.nis : null;

    $("jdl").textContent = siswa
      ? "Ubah data siswa"
      : "Tambah siswa";

    $("isi").innerHTML = `
      <div class="f">
        <label for="f-nis">NIS / NISN</label>

        <input
          id="f-nis"
          inputmode="numeric"
          autocomplete="off"
          maxlength="20"
          required
        >

        <small>Angka saja, 4–20 digit.</small>
      </div>

      <div class="f">
        <label for="f-nama">Nama lengkap</label>

        <input
          id="f-nama"
          autocomplete="off"
          maxlength="100"
          required
        >
      </div>

      <div class="baris">
        <div class="f">
          <label for="f-kelas">Kelas</label>

          <input
            id="f-kelas"
            list="dk"
            autocomplete="off"
            maxlength="20"
            placeholder="Misalnya VII A"
            required
          >
        </div>

        <div class="f">
          <label for="f-gender">Jenis kelamin</label>

          <select id="f-gender" required>
            <option value="">Pilih...</option>
            <option value="L">Laki-laki</option>
            <option value="P">Perempuan</option>
          </select>
        </div>
      </div>

      <div class="f">
        <label for="f-agama">Agama</label>

        <select id="f-agama" required>
          <option value="">Pilih...</option>

          ${AGAMA.map((a) =>
            `<option value="${esc(a)}">${esc(a)}</option>`
          ).join("")}
        </select>
      </div>
    `;

    if (siswa) {
      $("f-nis").value = siswa.nis;
      $("f-nama").value = siswa.nama;
      $("f-kelas").value = siswa.kelas;
      $("f-gender").value = siswa.gender;
      $("f-agama").value = siswa.agama;
    }

    $("gf").classList.add("hidden");

    $("dlg").showModal();

    $(siswa ? "f-nama" : "f-nis").focus();
  }

  function tampilkanGalatForm(teks) {
    $("gf").textContent = teks;
    $("gf").classList.remove("hidden");
  }

  /* =====================================================
     10. SIMPAN FORM
  ===================================================== */

  async function kirimForm(e) {
    e.preventDefault();

    if (sedangMemuat) {
      toast("Data masih dimuat. Tunggu sebentar.", "err");
      return;
    }

    const { rec, galat } = olahSiswa({
      nis: $("f-nis").value,
      nama: $("f-nama").value,
      kelas: $("f-kelas").value,
      gender: $("f-gender").value,
      agama: $("f-agama").value
    });

    if (galat) {
      tampilkanGalatForm(galat);
      return;
    }

    const bentrok = semua.some(
      (s) =>
        s.nis === rec.nis &&
        s.nis !== nisUbah
    );

    if (bentrok) {
      tampilkanGalatForm(
        "NIS/NISN " + rec.nis + " sudah terdaftar."
      );
      return;
    }

    const tombol = $("simpan");

    tombol.disabled = true;

    try {
      if (nisUbah) {
        await ganti(nisUbah, rec);
      } else {
        await simpanBanyak([rec]);
      }

      $("dlg").close();

      toast(
        nisUbah
          ? "Data siswa berhasil diperbarui."
          : "Siswa berhasil ditambahkan.",
        "ok"
      );

    } catch (error) {
      console.error("Simpan siswa:", error);

      tampilkanGalatForm(
        "Gagal menyimpan. Periksa koneksi dan aturan keamanan Firestore."
      );

    } finally {
      tombol.disabled = false;
    }
  }

  /* =====================================================
     11. HAPUS SISWA
  ===================================================== */

  async function hapusSiswa(nis) {
    const siswa = semua.find(
      (s) => s.nis === nis
    );

    if (!siswa) return;

    if (!(await konfirmasi(
      `Hapus ${siswa.nama} (${siswa.nis})?`,
      { judul: "Hapus siswa", ya: "Hapus", bahaya: true }
    ))) return;

    try {
      await hapusFirebase(nis);

      toast("Data siswa berhasil dihapus.", "ok");

    } catch (error) {
      console.error("Hapus siswa:", error);

      toast("Gagal menghapus siswa.", "err");
    }
  }

  /* =====================================================
     12. PEMBACA BERKAS: CSV
  ===================================================== */

  function parseCsv(teks) {
    teks = teks.replace(/^\uFEFF/, "");

    const baris1 = teks.split(/\r?\n/, 1)[0] || "";

    const pemisah =
      (baris1.match(/;/g) || []).length >
      (baris1.match(/,/g) || []).length
        ? ";"
        : ",";

    const hasil = [];

    let sel = "";
    let baris = [];
    let kutip = false;

    const tutupBaris = () => {
      baris.push(sel);
      sel = "";

      if (baris.some((x) => x.trim() !== "")) {
        hasil.push(baris);
      }

      baris = [];
    };

    for (let i = 0; i < teks.length; i++) {
      const c = teks[i];

      if (kutip) {
        if (c === '"') {
          if (teks[i + 1] === '"') {
            sel += '"';
            i++;
          } else {
            kutip = false;
          }
        } else {
          sel += c;
        }

      } else if (c === '"') {
        kutip = true;

      } else if (c === pemisah) {
        baris.push(sel);
        sel = "";

      } else if (c === "\n" || c === "\r") {
        if (c === "\r" && teks[i + 1] === "\n") i++;
        tutupBaris();

      } else {
        sel += c;
      }
    }

    tutupBaris();

    return hasil;
  }

  /* =====================================================
     13. PEMBACA BERKAS: EXCEL (.xlsx/.xls)
  ===================================================== */

  function muatSkrip(src) {
    return new Promise((ok, gagal) => {
      const s = document.createElement("script");

      s.src = src;
      s.onload = ok;
      s.onerror = () => {
        s.remove();
        gagal(new Error("Gagal memuat " + src));
      };

      document.head.appendChild(s);
    });
  }

  let janjiXlsx = null;

  function pastikanXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX);

    if (!janjiXlsx) {
      janjiXlsx = (async () => {
        for (const src of SUMBER_XLSX) {
          try {
            await muatSkrip(src);
            if (window.XLSX) return window.XLSX;
          } catch (e) {
            console.warn(e.message);
          }
        }

        janjiXlsx = null;
        throw new Error("Pustaka Excel tidak dapat dimuat.");
      })();
    }

    return janjiXlsx;
  }

  // Mengembalikan tabel (array baris, tiap baris array teks).
  async function bacaTabel(berkas) {
    const nama = berkas.name.toLowerCase();

    if (/\.(xlsx|xls)$/.test(nama)) {
      const X = await pastikanXlsx();

      const buku = X.read(
        await berkas.arrayBuffer(),
        { type: "array" }
      );

      const namaSheet =
        buku.SheetNames.find((n) =>
          n.trim().toLowerCase() === SHEET_DATA.toLowerCase()
        ) || buku.SheetNames[0];

      const baris = X.utils.sheet_to_json(
        buku.Sheets[namaSheet],
        { header: 1, raw: false, defval: "" }
      );

      return baris
        .map((b) => b.map((x) => String(x ?? "").trim()))
        .filter((b) => b.some((x) => x !== ""));
    }

    return parseCsv(await berkas.text());
  }

  /* =====================================================
     14. PEMETAAN KOLOM
  ===================================================== */

  // Alias judul kolom (sudah dinormalkan: huruf kecil, tanpa spasi di sekitar "/").
  const ALIAS_KOLOM = {
    nis: [
      "nis/nisn",
      "nis",
      "nisn",
      "no induk"
    ],

    nama: [
      "nama lengkap",
      "nama",
      "nama siswa"
    ],

    kelas: [
      "kelas",
      "rombel"
    ],

    gender: [
      "l/p",
      "gender",
      "jk",
      "jenis kelamin",
      "kelamin"
    ],

    agama: [
      "agama"
    ]
  };

  function barisKeObjek(tabel) {
    const urutan = [
      "nis",
      "nama",
      "kelas",
      "gender",
      "agama"
    ];

    const peta = {};

    tabel[0].forEach((sel, i) => {
      const s = normKepala(sel);

      for (const [kunci, alias] of Object.entries(ALIAS_KOLOM)) {
        if (alias.includes(s)) {
          peta[kunci] = i;
        }
      }
    });

    const adaHeader =
      peta.nis !== undefined &&
      peta.nama !== undefined;

    const kolom = adaHeader
      ? peta
      : Object.fromEntries(
          urutan.map((k, i) => [k, i])
        );

    const isi = adaHeader
      ? tabel.slice(1)
      : tabel;

    return isi.map((b, i) => ({
      nomor: i + (adaHeader ? 2 : 1),

      data: Object.fromEntries(
        urutan.map((k) => [
          k,
          kolom[k] !== undefined
            ? b[kolom[k]] || ""
            : ""
        ])
      )
    }));
  }

  /* =====================================================
     15. IMPOR KE FIREBASE
  ===================================================== */

  async function imporBerkas(berkas) {
    if (!berkas) return;

    try {
      const tabel = await bacaTabel(berkas);

      if (!tabel.length) {
        toast("Berkas kosong.", "err");
        return;
      }

      const sah = new Map();
      const gagal = [];

      barisKeObjek(tabel).forEach(({ nomor, data }) => {
        const { rec, galat } = olahSiswa(data);

        if (galat) {
          gagal.push(`Baris ${nomor}: ${galat}`);
        } else {
          sah.set(rec.nis, rec);
        }
      });

      if (!sah.size) {
        console.warn(gagal);

        toast(
          "Tidak ada baris valid. " + (gagal[0] || ""),
          "err"
        );

        return;
      }

      const daftarImpor = [...sah.values()];

      const ditimpa = daftarImpor.filter(
        (r) => semua.some((s) => s.nis === r.nis)
      ).length;

      const ringkas =
        `Impor ${daftarImpor.length} siswa` +
        (
          ditimpa
            ? ` (${ditimpa} NIS yang sudah ada akan diperbarui)`
            : ""
        ) +
        (
          gagal.length
            ? `. ${gagal.length} baris tidak valid akan dilewati`
            : ""
        ) +
        ". Lanjutkan?";

      if (!(await konfirmasi(
        ringkas,
        { judul: "Impor data siswa", ya: "Impor" }
      ))) return;

      await simpanBanyak(daftarImpor);

      if (gagal.length) {
        console.warn("Baris dilewati:", gagal);
      }

      toast(
        `${daftarImpor.length} siswa berhasil diimpor.` +
        (gagal.length ? ` ${gagal.length} baris dilewati.` : ""),
        "ok"
      );

    } catch (error) {
      console.error("Impor:", error);

      toast(
        "Gagal membaca atau menyimpan berkas. Pastikan formatnya sesuai templat.",
        "err"
      );

    } finally {
      $("berkas").value = "";
    }
  }

  /* =====================================================
     16. UNDUH TEMPLAT
  ===================================================== */

  async function unduhTemplat() {
    try {
      const res = await fetch(URL_TEMPLAT, { cache: "no-cache" });

      if (!res.ok) throw new Error("HTTP " + res.status);

      const url = URL.createObjectURL(await res.blob());

      const a = document.createElement("a");

      a.href = url;
      a.download = NAMA_TEMPLAT;

      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1000);

    } catch (error) {
      console.error("Unduh templat:", error);

      toast(
        "Templat tidak ditemukan di assets/templat/" + NAMA_TEMPLAT + ".",
        "err"
      );
    }
  }

  /* =====================================================
     17. EVENT
  ===================================================== */

  function pasangEvent() {
    $("cari").addEventListener(
      "input",
      render
    );

    $("fk").addEventListener(
      "change",
      render
    );

    $("tambah").addEventListener(
      "click",
      () => bukaForm(null)
    );

    $("templat").addEventListener(
      "click",
      unduhTemplat
    );

    $("impor").addEventListener(
      "click",
      () => $("berkas").click()
    );

    $("berkas").addEventListener(
      "change",
      (e) => imporBerkas(e.target.files[0])
    );

    $("frm").addEventListener(
      "submit",
      kirimForm
    );

    $("batal").addEventListener(
      "click",
      () => $("dlg").close()
    );

    $("dlg").addEventListener(
      "click",
      (e) => {
        if (e.target === $("dlg")) {
          $("dlg").close();
        }
      }
    );

    $("tb").addEventListener(
      "click",
      (e) => {
        const tombol = e.target.closest(
          "button[data-aksi]"
        );

        if (!tombol) return;

        const nis = tombol.dataset.id;

        if (tombol.dataset.aksi === "ubah") {
          const siswa = semua.find(
            (s) => s.nis === nis
          );

          if (siswa) bukaForm(siswa);

        } else {
          hapusSiswa(nis);
        }
      }
    );
  }

  /* =====================================================
     18. MULAI
  ===================================================== */

  function mulai() {
    pasangEvent();

    if (galatMuat) {
      tampilkanPeringatan(galatMuat);
      $("jml").textContent = "Data tidak dapat dimuat";
      $("tb").innerHTML = `
        <tr>
          <td colspan="6" class="kosong">
            Firebase belum terhubung.
          </td>
        </tr>
      `;
      return;
    }

    // Tampilkan kondisi pemuatan awal.
    $("tb").innerHTML = `
      <tr>
        <td colspan="6" class="kosong">
          Menghubungkan ke Firebase...
        </td>
      </tr>
    `;

    $("muatulang").addEventListener("click", muatUlang);
    mulaiFirebase();
  }

  mulai();

  // Hentikan listener jika halaman ditinggalkan.
  window.addEventListener("pagehide", () => {
    if (berhentiSnapshot) {
      berhentiSnapshot();
    }
  });

})();
</script>
