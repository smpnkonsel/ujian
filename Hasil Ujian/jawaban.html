<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>document.documentElement.style.visibility='hidden'</script>
<script type="module" src="../assets/js/guard.js" data-peran="admin"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">

<title>Jawaban Siswa · KW Learning</title>
<link rel="icon" type="image/jpeg" href="../assets/templat/logo.jpeg">
<link rel="stylesheet" href="../assets/css/neumorph.css">
<link rel="stylesheet" href="../assets/css/sidebar.css">
<style>
:root{--bg:var(--nm-bg);--card:var(--nm-bg);--ink:var(--nm-text);--muted:var(--nm-muted);--line:var(--nm-garis);--focus:var(--nm-accent)}

/* ---------- Tata letak: mepet sidebar, jarak kanan kecil ---------- */
.wrap{max-width:none;margin:0;padding:24px 24px calc(48px + env(safe-area-inset-bottom,0px))}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
h1{margin:0;font-size:24px}
.sub{margin:4px 0 0;color:var(--muted)}

/* ---------- Alat, tombol, isian (bayangan dari neumorph.css) ---------- */
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.tools input[type="search"]{flex:1 1 220px;min-width:0}
.tools select{flex:0 1 200px;min-width:0}
input,select,button{font:inherit;padding:9px 14px;border:0;border-radius:14px;background:var(--nm-bg);color:inherit}
input,select{box-shadow:var(--nm-in-s)}
button{cursor:pointer;font-weight:600;box-shadow:var(--nm-out-s)}
button:hover:not(:disabled){box-shadow:var(--nm-in-s)}
button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
button.primary{color:var(--nm-accent)}
button.small{padding:5px 12px;font-size:13px}
input:focus,select:focus{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- Tabel ---------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:0;border-radius:22px;box-shadow:var(--nm-out)}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}
th{background:transparent;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
td small{display:block;color:var(--muted)}
td.n,th.n{text-align:right}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--nm-accent) 7%,transparent)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.count{color:var(--muted);margin:10px 2px}

/* ---------- Dialog ---------- */
dialog{border:0;border-radius:24px;padding:22px;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;background:var(--card);color:var(--ink);box-shadow:var(--nm-out),0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,16,28,.5)}
dialog h2{margin:0 0 4px;font-size:18px;word-break:break-word}
#dInfo{color:var(--muted);margin:0 0 14px}
#dGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:12px;max-height:50dvh;overflow:auto;padding:4px}
#dGrid .sel{border:0;border-radius:14px;padding:8px;text-align:center;background:var(--nm-bg);box-shadow:var(--nm-out-s)}
#dGrid .sel span{display:block;font-size:11px;color:var(--muted)}
#dGrid .sel b{font-size:15px;word-break:break-all}
#dGrid .sel.kosong{background:color-mix(in srgb,var(--nm-warn) 18%,var(--nm-bg));box-shadow:var(--nm-in-s)}
.btns{display:flex;justify-content:flex-end;margin-top:16px}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100vw - 24px);background:var(--nm-bg);color:var(--ink);font-weight:600;padding:11px 22px;border-radius:14px;box-shadow:var(--nm-out);opacity:0;pointer-events:none;transition:opacity .2s;z-index:90;text-align:center}
#toast.on{opacity:1}

/* ---------- Tablet ---------- */
@media (max-width:820px){
  .wrap{padding:16px 14px calc(40px + env(safe-area-inset-bottom,0px))}
}

/* ---------- HP ---------- */
@media (max-width:680px){
  h1{font-size:20px}
  header > div:last-child{display:flex;gap:10px;width:100%}
  header > div:last-child button{flex:1 1 0}

  /* Area sentuh 44px, 16px mencegah zoom iOS */
  input,select,button{min-height:44px;font-size:16px}
  button.small{min-height:44px;padding:8px 14px}
  .tools input[type="search"],.tools select{flex:1 1 100%}

  /* Tabel berubah menjadi kartu per pengumpulan */
  .scroll{overflow-x:visible;background:transparent;box-shadow:none;border-radius:0}
  table{min-width:0}
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tbody tr{margin-bottom:16px;padding:14px 16px;background:var(--card);border-radius:20px;box-shadow:var(--nm-out)}
  tbody tr:last-child{margin-bottom:0}
  td,tbody tr:last-child td{padding:3px 0;border:0;overflow-wrap:anywhere}
  td.n{text-align:left}
  td[data-label]::before{content:attr(data-label) ": ";color:var(--muted)}
  td:first-child{font-weight:600}
  td:last-child button{width:100%;margin-top:8px}

  dialog{width:calc(100vw - 20px);padding:18px;border-radius:20px}
  .btns button{width:100%}
}

/* ---------- HP kecil ---------- */
@media (max-width:380px){
  .wrap{padding:12px 10px calc(36px + env(safe-area-inset-bottom,0px))}
  #dGrid{grid-template-columns:repeat(auto-fill,minmax(56px,1fr))}
}
</style>

</head>
<body>
<div id="sidebar-slot" data-mode="halaman" data-aktif="jawaban"></div>
<script src="../assets/js/sidebar-awal.js"></script>
<div id="mn">
<div class="top">
  <button id="burger" type="button" aria-label="Buka menu">☰</button>
  <h2>Jawaban Siswa</h2>
</div>


<div class="wrap">
  <div id="cfgwarn" class="hidden" style="background:#fff4c2;color:#5a4600;border:1px solid #e6cf6a;border-radius:9px;padding:8px 12px;margin-bottom:12px"></div>

  <header>
    <div>
      <h1>Jawaban Siswa</h1>
      <p class="sub">Kode jawaban yang dikirim siswa saat mengumpulkan ujian</p>
    </div>
    <div>
      <button id="btnMuat" type="button">Muat ulang</button>
      <button id="btnCsv" type="button" class="primary">Unduh CSV</button>
    </div>
  </header>

  <div class="tools">
    <input type="search" id="q" placeholder="Cari nama atau NIS" aria-label="Cari siswa">
    <select id="fUjian" aria-label="Filter ujian"></select>
    <select id="fKelas" aria-label="Filter kelas"></select>
  </div>

  <div class="scroll">
    <table>
      <thead><tr><th>Siswa</th><th>Kelas</th><th>Ujian</th><th class="n">Benar / Salah / Kosong</th><th class="n">Nilai</th><th></th></tr></thead>
      <tbody id="isi"></tbody>
    </table>
    <div class="empty" id="kosong">Memuat…</div>
  </div>
  <p class="count" id="jml"></p>
</div>

<dialog id="dlg">
  <h2 id="dJudul"></h2>
  <p id="dInfo"></p>
  <div id="dGrid"></div>
  <div class="btns"><button type="button" id="tutup" class="primary">Tutup</button></div>
</dialog>
<div id="toast" role="status"></div>

<script type="module">
/* =========================================================
   Jawaban Siswa — data dari ../assets/js/firebase-pusat.js
   Menampilkan kode jawaban tiap siswa dari koleksi "hasil"
   (tiga Firebase tingkat VII/VIII/IX).
   Kode: pg/bs = huruf (bs: A=Benar, B=Salah), pgk = huruf-huruf,
   jodoh = nomor pasangan dipisah koma, "-" = tidak dijawab.
========================================================= */
const LOKASI_FIREBASE = '../assets/js/firebase-pusat.js';
const BATAS_PER_TINGKAT = 500;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const urutAlfa = (a, b) => String(a).localeCompare(String(b), 'id', {numeric:true});
const ms = v => !v ? 0 : typeof v === 'number' ? v : v.toMillis ? v.toMillis() : (v.toDate ? v.toDate().getTime() : (new Date(v).getTime() || 0));

function peringatan(teks){
  const w = $('cfgwarn');
  w.classList.remove('hidden');
  const p = document.createElement('div');
  p.textContent = teks;
  w.appendChild(p);
}
let tmToast;
function toast(teks){
  const t = $('toast'); t.textContent = teks; t.classList.add('on');
  clearTimeout(tmToast); tmToast = setTimeout(() => t.classList.remove('on'), 2200);
}
function unduhCsv(nama, baris){
  const teks = baris.map(b => b.map(v => {
    const s = String(v ?? '');
    return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + teks], {type:'text/csv;charset=utf-8'}));
  a.download = nama;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* Dokumen "hasil" -> baris tabel. Sesuaikan nama field di sini bila berbeda. */
function norm(id, x, tingkat){
  return {
    id, tingkat,
    nama: x.nama || x.nis || '(tanpa nama)',
    nis: x.nis || '',
    kelas: x.kelas || '',
    paket: x.paket || x.paketNama || x.ujian || x.judul || x.mapel || '(tanpa judul)',
    benar: x.benar, salah: x.salah, kosong: x.kosong,
    nilai: x.nilai ?? x.skor,
    jawaban: typeof x.jawaban === 'string' ? x.jawaban : Array.isArray(x.jawaban) ? x.jawaban.join('|') : '',
    waktu: ms(x.selesai || x.waktu || x.dikumpulkan || x.dibuat)
  };
}

let rows = [];

function pecah(r){
  if(!r.jawaban) return [];
  return r.jawaban.includes('|') ? r.jawaban.split('|') : (r.jawaban.includes(',') && !/^[A-F-]+(,[A-F-]+)*$/.test(r.jawaban) ? [r.jawaban] : r.jawaban.split(''));
}

function fillSelect(sel, label, values){
  const cur = sel.value;
  sel.innerHTML = `<option value="">${label}</option>` + values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  sel.value = values.includes(cur) ? cur : '';
}

function saring(){
  const u = $('fUjian').value, k = $('fKelas').value, q = $('q').value.trim().toLowerCase();
  return rows.filter(r => (!u || r.paket === u) && (!k || r.kelas === k) &&
    (!q || (r.nama + ' ' + r.nis).toLowerCase().includes(q)))
    .sort((a, b) => urutAlfa(a.paket, b.paket) || urutAlfa(a.kelas, b.kelas) || urutAlfa(a.nama, b.nama));
}

function render(){
  fillSelect($('fUjian'), 'Semua ujian', [...new Set(rows.map(r => r.paket))].sort(urutAlfa));
  fillSelect($('fKelas'), 'Semua kelas', [...new Set(rows.map(r => r.kelas).filter(Boolean))].sort(urutAlfa));
  const list = saring();

  $('isi').innerHTML = list.map(r => `<tr data-id="${esc(r.id)}" data-t="${esc(r.tingkat)}">
      <td>${esc(r.nama)}<small>NIS ${esc(r.nis || '–')}</small></td>
      <td data-label="Kelas">${esc(r.kelas)}</td>
      <td data-label="Ujian">${esc(r.paket)}</td>
      <td class="n" data-label="Benar / Salah / Kosong">${r.benar ?? '–'} / ${r.salah ?? '–'} / ${r.kosong ?? '–'}</td>
      <td class="n" data-label="Nilai"><b>${r.nilai ?? '–'}</b></td>
      <td><button type="button" class="small">Lihat jawaban</button></td></tr>`).join('');

  $('kosong').hidden = list.length > 0;
  $('kosong').textContent = rows.length ? 'Tidak ada data yang cocok.' : 'Belum ada siswa yang mengumpulkan ujian.';
  $('jml').textContent = list.length + ' dari ' + rows.length + ' pengumpulan';
}

function detail(r){
  const j = pecah(r);
  $('dJudul').textContent = r.nama + ' — ' + r.paket;
  $('dInfo').textContent = 'NIS ' + (r.nis || '–') + ' · Kelas ' + r.kelas + ' · Nilai ' + (r.nilai ?? '–') +
    ' · Benar ' + (r.benar ?? '–') + ', salah ' + (r.salah ?? '–') + ', kosong ' + (r.kosong ?? '–');
  $('dGrid').innerHTML = j.length
    ? j.map((v, i) => `<div class="sel ${v === '-' ? 'kosong' : ''}"><span>${i + 1}</span><b>${esc(v)}</b></div>`).join('')
    : '<p>Jawaban tidak tersimpan untuk pengumpulan ini.</p>';
  $('dlg').showModal();
}

async function muat(){
  const {F, dbTingkat, TINGKAT, KOLEKSI} = await import(LOKASI_FIREBASE);
  const kol = KOLEKSI.hasil || 'hasil';
  const hasil = await Promise.allSettled(TINGKAT.map(t =>
    F.getDocs(F.query(F.collection(dbTingkat(t), kol), F.limit(BATAS_PER_TINGKAT)))));

  const baru = [], gagal = [];
  hasil.forEach((h, i) => {
    if(h.status === 'fulfilled') h.value.docs.forEach(d => baru.push(norm(d.id, d.data(), TINGKAT[i])));
    else { gagal.push(TINGKAT[i]); console.warn(kol, TINGKAT[i], h.reason); }
  });
  if(gagal.length === TINGKAT.length) throw new Error('semua tingkat gagal dimuat. Periksa aturan Firestore atau koneksi.');
  if(gagal.length) peringatan('Koleksi "' + kol + '" tingkat ' + gagal.join(', ') + ' gagal dimuat. Periksa aturan Firestore atau koneksi.');

  rows = baru.sort((a, b) => (b.waktu || 0) - (a.waktu || 0));
  render();
}

$('isi').onclick = e => {
  const tr = e.target.closest('tr'); if(!tr) return;
  const r = rows.find(x => x.id === tr.dataset.id && x.tingkat === tr.dataset.t);
  if(r) detail(r);
};
$('tutup').onclick = () => $('dlg').close();
['fUjian', 'fKelas'].forEach(id => $(id).addEventListener('change', render));
$('q').addEventListener('input', render);
$('btnMuat').onclick = () => {
  $('cfgwarn').innerHTML = ''; $('cfgwarn').classList.add('hidden');
  muat().then(() => toast('Data dimuat ulang.')).catch(e => peringatan(String(e.message || e)));
};
$('btnCsv').onclick = () => unduhCsv('jawaban-siswa.csv', [
  ['NIS', 'Nama', 'Kelas', 'Ujian', 'Nilai', 'Jawaban'],
  ...saring().map(r => [r.nis, r.nama, r.kelas, r.paket, r.nilai, pecah(r).join(' ')])
]);

try { await muat(); }
catch(e){ console.error(e); peringatan('Jawaban gagal dimuat: ' + (e.message || e.code || e)); render(); }
</script>
</div>
</body>
</html>
