<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dasbor — KW Learning</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Poppins:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="templat/logo.jpeg">
<link rel="apple-touch-icon" href="templat/logo.jpeg">
<link rel="stylesheet" href="css/dasbor.css">
<link rel="stylesheet" href="css/sidebar.css">

</head>

<body>

<!-- Sidebar dipasang seketika oleh js/sidebar-awal.js -->
<div id="sidebar-slot" data-mode="halaman" data-aktif="dasbor"></div>
<script src="js/sidebar-awal.js"></script>

<div id="mn">

 <div class="top">
  <button id="burger" aria-label="Buka menu">☰</button>
  <h2 id="ttl">Dasbor</h2>
 </div>

 <div class="wrap">

  <div id="cfgwarn" class="msg warn hidden">
   <b>Ada masalah pada halaman ini.</b>
  </div>

  <!-- ALAT: muat ulang data -->
  <div class="alat">

   <span id="upd" class="upd">Memuat data…</span>

   <button class="btn" id="muat" type="button">Muat ulang data</button>
  </div>

  <!-- ANGKA RINGKAS -->
  <div class="stats">
   <div class="st"><b id="s2">0</b><span>Total token</span></div>
   <div class="st"><b id="s3">0</b><span>Peserta mengumpulkan</span></div>
  </div>

  <div class="two">
   <div class="card">
    <h3>Sebaran nilai</h3>
    <div id="dist"></div>
   </div>

   <div class="card">
    <h3>Token aktif</h3>
    <div id="dtok"></div>
   </div>
  </div>

  <div class="card">
   <h3>Rata-rata per kelas</h3>
   <div id="dkls"></div>
  </div>

  <div class="card">
   <h3>Pengumpulan terbaru</h3>
   <div class="tw" style="border:0;box-shadow:none">
    <table>
     <thead>
      <tr>
       <th>Nama</th>
       <th>Ujian</th>
       <th>Nilai</th>
       <th>Waktu</th>
      </tr>
     </thead>
     <tbody id="dlast"></tbody>
    </table>
   </div>
  </div>

 </div>
</div>

<script type="module" src="js/dasbor.js?v=6"></script>

</body>
</html>
