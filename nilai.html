<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nilai — KW Learning</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="templat/logo.jpeg">
<link rel="apple-touch-icon" href="templat/logo.jpeg">
<!-- css/nilai.css = isi file nilai.css (neumorphism) -->
<link rel="stylesheet" href="css/nilai.css">
<link rel="stylesheet" href="css/sidebar.css">

</head>

<body>

<!-- Sidebar dipasang seketika oleh js/sidebar-awal.js -->
<div id="sidebar-slot" data-mode="halaman" data-aktif="nilai"></div>
<script src="js/sidebar-awal.js"></script>

<div id="mn">

 <div class="top">
  <button id="burger" aria-label="Buka menu">☰</button>
  <h2 id="ttl">Nilai</h2>
 </div>

 <div class="wrap">

  <div id="cfgwarn" class="msg warn hidden">
   <b>Ada masalah pada halaman ini.</b>
  </div>

  <div class="tools">
   <select id="fu">
    <option value="">Semua ujian</option>
   </select>

   <select id="fk">
    <option value="">Semua kelas</option>
   </select>

   <input id="fq" type="search"
    placeholder="Cari nama peserta…">
  </div>

  <div class="stats">
   <div class="st"><b id="n1">0</b><span>Peserta</span></div>
   <div class="st"><b id="n2">–</b><span>Rata-rata</span></div>
   <div class="st"><b id="n3">–</b><span>Tertinggi</span></div>
   <div class="st"><b id="n4">–</b><span>Terendah</span></div>
  </div>

  <div class="acts" style="margin-bottom:22px">
   <button class="btn p" id="dl">Unduh CSV (Excel)</button>
  </div>

  <div class="tw">
   <table>
    <thead>
     <tr>
      <th>No</th>
      <th>Nama</th>
      <th>Kelas</th>
      <th>Ujian</th>
      <th>Token</th>
      <th>Benar</th>
      <th>Salah</th>
      <th>Nilai</th>
      <th>Waktu</th>
     </tr>
    </thead>
    <tbody id="nb">
     <tr><td colspan="9" class="empty">Memuat…</td></tr>
    </tbody>
   </table>
  </div>

 </div>
</div>

<script type="module" src="js/nilai.js?v=6"></script>

</body>
</html>
