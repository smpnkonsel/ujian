<style>
/* Halaman Data Guru · KW Learning (responsif)
   Warna, tombol, isian, dan dialog mengikuti neumorph.css.
   Di sini hanya tata letak dan hal khusus halaman ini. */

:root {
  --redup: var(--nm-muted);
  --utama: var(--nm-accent);
  --bahaya: var(--nm-warn);
  --peringatan-bg: color-mix(in srgb, var(--nm-kuning) 16%, var(--nm-bg));
  --peringatan-teks: var(--nm-kuning);
}

/* ---------- Tata letak: mepet sidebar, jarak kanan kecil ---------- */
.isi {
  max-width: none;
  margin: 0;
  padding: 24px 24px calc(48px + env(safe-area-inset-bottom, 0px));
}

.atas { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
.atas h1 { margin: 0 0 2px; font-size: 1.6rem; line-height: 1.2; }
.atas p { margin: 0; color: var(--redup); }
#rinci { font-size: .85rem; }

.alat { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.atas .alat { margin-bottom: 0; }

/* ---------- Ukuran kontrol (tampilan dari neumorph.css) ---------- */
button { min-height: 40px; padding: 8px 16px; }
button.kecil { min-height: 32px; padding: 4px 12px; font-size: .85rem; }
button.bahaya { color: var(--bahaya); }
input, select { min-height: 40px; min-width: 0; }
#cari { flex: 1 1 240px; max-width: 360px; }
#fk { flex: 0 1 200px; }

/* ---------- Peringatan ---------- */
.warn {
  background: var(--peringatan-bg);
  color: var(--peringatan-teks);
  padding: 10px 14px;
  margin-bottom: 14px;
  font-size: .9rem;
}

/* ---------- Tabel ---------- */
.k { background: var(--nm-bg); border: 0; border-radius: 22px; box-shadow: var(--nm-out); }
.tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 22px; }

table { width: 100%; border-collapse: collapse; min-width: 560px; }
th, td { text-align: left; padding: 12px 16px; vertical-align: middle; border-bottom: 1px solid var(--nm-garis); }
th {
  background: transparent;
  font-size: .78rem;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--redup);
  font-weight: 600;
  white-space: nowrap;
}
tbody tr:last-child td { border-bottom: 0; }
td.aksi { text-align: right; white-space: nowrap; }
td.aksi button + button { margin-left: 8px; }
td.kosong { text-align: center; color: var(--redup); padding: 36px 16px; }
.id { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9rem; }

.lencana {
  display: inline-block;
  padding: 3px 12px;
  margin: 3px 6px 3px 0;
  border-radius: 999px;
  background: var(--nm-bg);
  box-shadow: var(--nm-in-s);
  color: var(--utama);
  font-size: .78rem;
  line-height: 1.4;
}
.lencana b { font-weight: 600; }

/* ---------- Dialog ---------- */
dialog { width: min(480px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 0; overflow: auto; }
dialog form { padding: 22px; }
dialog h2 { margin: 0 0 14px; font-size: 1.2rem; }

.f { display: block; margin-bottom: 14px; }
.f span { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 6px; }
.f small { display: block; color: var(--redup); font-size: .78rem; margin-top: 4px; }
.f input { width: 100%; }
.f textarea {
  width: 100%;
  min-height: 110px;
  padding: 10px 14px;
  border: 0;
  border-radius: 14px;
  background: var(--nm-bg);
  box-shadow: var(--nm-in-s);
  color: var(--nm-text);
  font: inherit;
  font-size: .92rem;
  line-height: 1.5;
  resize: vertical;
}

.gf {
  color: var(--bahaya);
  font-size: .88rem;
  margin: 0 0 10px;
  padding: 8px 12px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--nm-warn) 12%, var(--nm-bg));
}

/* Baris tombol di dialog (div.tombol, bukan tombolnya) */
.tombol { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }

/* Dialog konfirmasi (tengah layar) */
.konfirm { width: min(380px, calc(100vw - 32px)); text-align: center; }
.kbox { padding: 24px 22px 20px; }
.kbox h2 { margin: 0 0 8px; font-size: 1.15rem; }
.kbox p { margin: 0 0 20px; color: var(--redup); white-space: pre-line; }
.konfirm .tombol { justify-content: center; }
.konfirm .tombol button { min-width: 96px; }
button.utama.merah { color: var(--bahaya) !important; }

/* ---------- Toast: di tengah layar ----------
   #toast.toast mengalahkan #toast milik neumorph.css
   (opacity 0, di bawah layar, butuh class .on). */
#toast.toast {
  position: fixed;
  inset: auto;
  left: 50%;
  top: 50%;
  bottom: auto;
  margin: 0;
  transform: translate(-50%, -50%);
  width: max-content;
  max-width: min(420px, calc(100vw - 32px));
  padding: 16px 24px;
  border: 0;
  border-radius: 14px;
  background: var(--nm-bg);
  color: var(--nm-text);
  box-shadow: var(--nm-out);
  font-size: .95rem;
  font-weight: 500;
  text-align: center;
  z-index: 2000;
  opacity: 1;
  pointer-events: auto;
  transition: none;
  animation: toast-masuk .18s ease-out;
}
@keyframes toast-masuk {
  from { opacity: 0; transform: translate(-50%, -46%) scale(.96); }
  to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

/* ---------- Tablet ---------- */
@media (max-width: 820px) {
  .isi { padding: 16px 14px calc(40px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- HP ---------- */
@media (max-width: 600px) {
  .atas .alat { width: 100%; }
  .atas .alat button { flex: 1 1 auto; }
  #cari, #fk { flex: 1 1 100%; max-width: none; width: 100%; }

  input, select, textarea { font-size: 16px; }  /* cegah zoom iOS */
  input, select { min-height: 42px; }

  /* Tabel jadi kartu */
  .k.tbl { background: transparent; box-shadow: none; overflow: visible; border-radius: 0; }
  .tbl table, .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; min-width: 0; }
  .tbl thead { display: none; }
  .tbl tbody tr {
    margin-bottom: 16px;
    padding: 14px 16px;
    background: var(--nm-bg);
    border-radius: 20px;
    box-shadow: var(--nm-out);
  }
  .tbl td { padding: 4px 0; border: 0; white-space: normal; overflow-wrap: anywhere; }
  .tbl td[data-label]::before {
    content: attr(data-label);
    display: block;
    margin-bottom: 2px;
    color: var(--redup);
    font-size: .8rem;
    font-weight: 400;
  }
  .tbl td.aksi { margin-top: 8px; text-align: left; }
  .tbl td.aksi button { min-height: 38px; }
  .tbl td.kosong { padding: 28px 8px; text-align: center; }

  dialog { width: calc(100vw - 20px); border-radius: 20px; }
  dialog form { padding: 18px; }
  .tombol button { flex: 1 1 0; }
}

/* ---------- HP kecil ---------- */
@media (max-width: 380px) {
  .isi { padding: 12px 10px 36px; }
}
</style>

<script type="module">
/*
  Firebase dimuat dengan import dinamis. Jika berkas firebase-pusat.js
  gagal dimuat, tombol-tombol lain tetap berfungsi dan penyebabnya
  ditampilkan di halaman (bukan hanya di konsol).
*/
let F, dbSiswaGuru, FIREBASE_PUSAT = {};
let KOLEKSI = { guru: "guru", siswa: "siswa" };
let galatMuat = "";

try {
  ({ F, dbSiswaGuru, KOLEKSI, FIREBASE_PUSAT } = await import("../assets/js/firebase-pusat.js"));
} catch (e) {
  console.error("firebase-pusat.js gagal dimuat:", e);

  galatMuat = location.protocol === "file:"
    ? "Halaman dibuka langsung dari berkas (file://), sehingga Firebase tidak bisa dimuat. Buka lewat server atau hosting (mis. localhost atau Firebase Hosting)."
    : "Gagal memuat assets/js/firebase-pusat.js (" + (e && e.message ? e.message : e) + "). Pastikan berkas itu ada di assets/js/ dan mengekspor F, dbSiswaGuru, dan KOLEKSI.";
}

(() => {
  "use strict";

  /* =========================================
     KONFIGURASI
  ========================================= */

  const $ = (id) => document.getElementById(id);

  const KOLEKSI_GURU = KOLEKSI.guru;

  // Daftar mapel: terisi otomatis saat guru ditambah, diubah, atau diimpor.
  // Letaknya di Firestore: koleksi "Daftar" -> dokumen "mapel".
  // Semua mapel menjadi field langsung di dokumen itu (satu field per mapel).
  const JALUR_MAPEL = ["Daftar", "mapel"];

  // Singkatan mapel, kunci = id mapel (nama huruf kecil, spasi jadi "-").
  const SINGKATAN_MAPEL = {
    "pendidikan-agama-islam": "PAI",
    "pendidikan-agama-hindu": "PAH",
    "pendidikan-pancasila": "PKKn",
    "bahasa-indonesia": "BIND",
    "matematika": "MTK",
    "ipa": "IPA",
    "ips": "IPS",
    "bahasa-inggris": "BING",
    "pjok": "PJOK",
    "informatika": "INFORMATIKA",
    "seni-budaya": "SB"
  };

  // Berkas templat yang diunduh (dibuat sesuai kolom di bawah).
  const NAMA_TEMPLAT = "Template_Data_Guru.xlsx";
  const URL_TEMPLAT = "../assets/templat/" + NAMA_TEMPLAT;
  const SHEET_DATA = "Data Guru";

  // Pustaka pembaca Excel (SheetJS): coba salinan lokal dulu, lalu CDN.
  const SUMBER_XLSX = [
    "../assets/js/xlsx.full.min.js",
    "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
  ];

  /*
    Struktur dokumen guru di Firestore:
    {
      id, nama,
      mengajar: [ { mapel: "IPA", kelas: ["IX A", "IX B"] }, ... ],
      daftarMapel: ["IPA", ...],      // turunan, untuk pencarian
      daftarKelas: ["IX A", ...]      // turunan, untuk penyaringan
    }

    Field milik halaman lain (mis. Akun Guru: akunEmail, akunSandi,
    akunAktif, akunProyek, ...) juga ada di dokumen yang sama.
    Halaman ini TIDAK boleh menimpanya, jadi penyimpanan memakai merge.

    Struktur daftar mapel di Firestore (Daftar/mapel), field langsung:
    {
      "matematika": { id: "matematika", nama: "Matematika", singkatan: "MTK" },
      "pendidikan-agama-islam": { id: "...", nama: "Pendidikan Agama Islam", singkatan: "PAI" },
      ...
      diperbaruiPada
    }
    Nama field = id mapel (nama huruf kecil, spasi jadi "-").
    Mapel yang sudah ada tidak ditulis ulang, jadi nama/kode yang
    sudah Anda rapikan di Daftar/mapel tidak tertimpa.

    Templat Excel/CSV: satu baris per penugasan (mapel + kelas).
    NIP yang sama di beberapa baris digabung menjadi satu guru.
    Kolom: NIP / ID Guru | Nama Lengkap | Mata Pelajaran | Kelas Diampu
  */

  // Isian pada formulir tambah/ubah.
  const BIDANG_FORM = [
    { k: "id", l: "NIP / ID Guru" },
    { k: "nama", l: "Nama Lengkap" },
    { k: "mengajar", l: "Mapel & kelas yang diajar", area: true }
  ];

  // Kolom pada berkas impor.
  const BIDANG_IMPOR = [
    {
      k: "id",
      l: "NIP / ID Guru",
      wajib: true,
      alias: ["nip/id guru", "nip/id", "nip", "id guru", "id", "nuptk"]
    },
    {
      k: "nama",
      l: "Nama Lengkap",
      wajib: true,
      alias: ["nama lengkap", "nama", "nama guru"]
    },
    {
      k: "mapel",
      l: "Mata Pelajaran",
      wajib: true,
      alias: ["mata pelajaran", "mapel", "mata pelajaran diampu"]
    },
    {
      k: "kelas",
      l: "Kelas Diampu",
      wajib: true,
      alias: ["kelas diampu", "kelas"]
    }
  ];

  const CARI = ["id", "nama"];

  let data = [];
  let idDiedit = null;
  let sedangMemuat = false;
  let timerToast;

  // Mapel yang sudah ada di Daftar/mapel: id dokumen -> nama.
  let petaMapel = new Map();

  /* =========================================
     UTILITAS
  ========================================= */

  const esc = (s) =>
    String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[c]);

  const rapikan = (s) =>
    String(s ?? "").replace(/\s+/g, " ").trim();

  const normKepala = (s) =>
    rapikan(s).toLowerCase().replace(/\s*\/\s*/g, "/");

  // Kelas ditulis angka Romawi: "7a", "VII-A", "VII A" -> "VII A"
  const ROMAWI = { "7": "VII", "8": "VIII", "9": "IX" };

  function normKelas(v) {
    const s = rapikan(v)
      .toUpperCase()
      .replace(/[.\-_]/g, " ")
      .replace(/\s+/g, " ")
      .trim();

    const m = s.match(/^(VII|VIII|IX|7|8|9)\s*([A-Z])$/);

    return m ? `${ROMAWI[m[1]] || m[1]} ${m[2]}` : s;
  }

  const pecahKelas = (s) =>
    String(s || "")
      .split(/[,;]/)
      .map(normKelas)
      .filter(Boolean);

  const RANK = { VII: 7, VIII: 8, IX: 9 };

  function kunciKelas(k) {
    const m = String(k).match(/^(VII|VIII|IX)\s+(.*)$/);
    return m ? [RANK[m[1]], m[2]] : [99, String(k)];
  }

  const banding = (a, b) =>
    a.localeCompare(b, "id", {
      numeric: true,
      sensitivity: "base"
    });

  const urutKelas = (a, b) => {
    const x = kunciKelas(a);
    const y = kunciKelas(b);
    return (x[0] - y[0]) || banding(x[1], y[1]);
  };

  const urut = banding;

  /* ---------- Penugasan mengajar (mapel + kelas) ---------- */

  // "IPA: IX A, IX B\nMatematika: VIII A" -> [{mapel, kelas:[...]}]
  // Mapel yang sama di dua baris digabung.
  function pecahMengajar(teks) {
    const hasil = [];

    String(teks || "")
      .split(/\r?\n/)
      .map(rapikan)
      .filter(Boolean)
      .forEach((baris) => {
        const [m, ...sisa] = baris.split(":");
        const mapel = rapikan(m);
        const kelas = pecahKelas(sisa.join(":"));

        if (!mapel) return;

        let ada = hasil.find(
          (x) => x.mapel.toLowerCase() === mapel.toLowerCase()
        );

        if (!ada) {
          ada = { mapel, kelas: [] };
          hasil.push(ada);
        }

        kelas.forEach((k) => {
          if (!ada.kelas.includes(k)) ada.kelas.push(k);
        });
      });

    hasil.forEach((x) => x.kelas.sort(urutKelas));

    return hasil;
  }

  const teksMengajar = (arr) =>
    (arr || [])
      .map((x) => `${x.mapel}: ${x.kelas.join(", ")}`)
      .join("\n");

  // Kompatibel dengan data lama (mapel dan kelas berupa teks biasa).
  function ambilMengajar(d) {
    if (Array.isArray(d.mengajar)) return d.mengajar;

    return d.mapel
      ? [{ mapel: String(d.mapel).trim(), kelas: pecahKelas(d.kelas) }]
      : [];
  }

  // Mengisi kolom turunan.
  function lengkapi(item) {
    item.daftarMapel = [
      ...new Set(item.mengajar.map((x) => x.mapel))
    ];

    item.daftarKelas = [
      ...new Set(item.mengajar.flatMap((x) => x.kelas))
    ].sort(urutKelas);

    // Tautan ke field mapel di Daftar/mapel (nama field = id mapel).
    item.daftarIdMapel = [
      ...new Set(item.daftarMapel.map(idMapel).filter(Boolean))
    ];

    return item;
  }

  /* Pemberitahuan (toast) di tengah layar, tanpa alert/confirm bawaan browser. */

  const ADA_POPOVER =
    typeof HTMLElement !== "undefined" && "popover" in HTMLElement.prototype;

  function tampilToast(el) {
    if (ADA_POPOVER) {
      if (!el.matches(":popover-open")) el.showPopover();
    } else {
      el.style.display = "block";
    }
  }

  function sembunyiToast(el) {
    if (ADA_POPOVER) {
      try {
        if (el.matches(":popover-open")) el.hidePopover();
      } catch (e) { /* abaikan */ }
    } else {
      el.style.display = "none";
    }
  }

  // Dialog konfirmasi di tengah layar; mengembalikan true/false.
  function konfirmasi(pesan, opsi = {}) {
    const { judul = "Konfirmasi", ya = "Ya", bahaya = false } = opsi;

    return new Promise((selesai) => {
      const dlg = $("dlgk");
      const btnYa = $("kya");
      const btnTidak = $("ktidak");
      let hasil = false;

      $("kjdl").textContent = judul;
      $("kpesan").textContent = pesan;
      btnYa.textContent = ya;
      btnYa.classList.toggle("merah", bahaya);

      const onYa = () => { hasil = true; dlg.close(); };
      const onTidak = () => dlg.close();
      const onLatar = (e) => { if (e.target === dlg) dlg.close(); };

      const bersih = () => {
        btnYa.removeEventListener("click", onYa);
        btnTidak.removeEventListener("click", onTidak);
        dlg.removeEventListener("click", onLatar);
        dlg.removeEventListener("close", bersih);
        selesai(hasil);
      };

      btnYa.addEventListener("click", onYa);
      btnTidak.addEventListener("click", onTidak);
      dlg.addEventListener("click", onLatar);
      dlg.addEventListener("close", bersih);

      dlg.showModal();
      btnTidak.focus();
    });
  }

  function toast(pesan) {
    let el = $("toast");

    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      el.className = "toast";
      el.setAttribute("role", "status");

      if (ADA_POPOVER) el.setAttribute("popover", "manual");
      else el.style.display = "none";

      document.body.appendChild(el);
    }

    el.textContent = pesan;

    tampilToast(el);

    // ulangi animasi bila toast sedang tampil
    el.style.animation = "none";
    void el.offsetWidth;
    el.style.animation = "";

    clearTimeout(timerToast);

    timerToast = setTimeout(() => sembunyiToast(el), 4000);
  }

  // Penyebab galat Firebase (mis. "permission-denied") untuk ditampilkan.
  function alasanGalat(e) {
    return (e && (e.code || e.message)) || "tidak diketahui";
  }

  function peringatan(pesan) {
    const el = $("cfgwarn");

    if (!el) return;

    if (!pesan) {
      el.classList.add("hidden");
      return;
    }

    el.textContent = pesan;
    el.classList.remove("hidden");
  }

  /* =========================================
     KOLEKSI MAPEL
     Dokumen: Daftar/mapel  ->  satu field per mapel: { [id]: { id, nama, singkatan } }
  ========================================= */

  // "Pendidikan Agama Islam" -> "pendidikan-agama-islam"
  // Huruf besar/kecil dan spasi ganda tidak membuat mapel ganda.
  function idMapel(nama) {
    return rapikan(nama)
      .toLowerCase()
      .replace(/[^\p{L}\p{N}]+/gu, "-")
      .replace(/^-+|-+$/g, "");
  }

  // Membaca mapel yang sudah ada dari dokumen Daftar/mapel.
  // Gagal membaca tidak menghentikan halaman.
  async function muatMapel() {
    try {
      const snap = await F.getDocs(
        F.collection(dbSiswaGuru, JALUR_MAPEL[0])
      );

      const dok = snap.docs.find((d) => d.id === JALUR_MAPEL[1]);
      const isi = dok ? dok.data() : {};

      petaMapel = new Map(
        Object.entries(isi)
          .filter(([, v]) => v && typeof v === "object" && v.nama)
          .map(([id, v]) => [id, v.nama])
      );

    } catch (error) {
      console.warn("Daftar mapel tidak terbaca:", error);
    }
  }

  // Dari daftar nama mapel, ambil yang belum ada di koleksi (tanpa duplikat).
  function mapelBaru(daftarNama) {
    const unik = new Map();

    daftarNama.forEach((n) => {
      const nama = rapikan(n);
      const id = idMapel(nama);

      if (id && !petaMapel.has(id) && !unik.has(id)) unik.set(id, nama);
    });

    return [...unik].map(([id, nama]) => ({ id, nama }));
  }

  // Singkatan dari tabel di atas. Mapel yang belum terdaftar di tabel:
  // nama beberapa kata -> huruf awal tiap kata, satu kata -> huruf besar
  // (maks. 8 huruf). Bisa diubah langsung di Firestore bila kurang tepat.
  function singkatanMapel(nama, id) {
    if (SINGKATAN_MAPEL[id]) return SINGKATAN_MAPEL[id];

    const kata = rapikan(nama).split(" ").filter(Boolean);

    if (kata.length > 1) {
      return kata.map((k) => k[0]).join("").toUpperCase();
    }

    return (kata[0] || "").toUpperCase().slice(0, 8);
  }

  // Semua mapel baru ditulis sekaligus ke dokumen Daftar/mapel
  // (merge: field mapel lain di dokumen itu tidak tersentuh).
  function tulisMapelKeBatch(batch, baru) {
    if (!baru.length) return;

    const isi = { diperbaruiPada: F.serverTimestamp() };

    baru.forEach((m) => {
      isi[m.id] = {
        id: m.id,
        nama: m.nama,
        singkatan: singkatanMapel(m.nama, m.id)
      };
    });

    batch.set(F.doc(dbSiswaGuru, ...JALUR_MAPEL), isi, { merge: true });
  }

  const catatMapel = (baru) =>
    baru.forEach((m) => petaMapel.set(m.id, m.nama));

  // Menyimpan mapel baru sendiri (dipakai impor dan tombol Sinkron mapel).
  // Mengembalikan jumlah mapel yang ditambahkan.
  async function simpanMapelTerpisah(daftarNama) {
    const baru = mapelBaru(daftarNama);

    if (!baru.length) return 0;

    const batch = F.writeBatch(dbSiswaGuru);

    tulisMapelKeBatch(batch, baru);
    await batch.commit();
    catatMapel(baru);

    return baru.length;
  }

  /* =========================================
     FIREBASE: MEMUAT DATA GURU
  ========================================= */

  async function muatGuru() {
    sedangMemuat = true;

    try {
      peringatan("");

      const ref = F.collection(
        dbSiswaGuru,
        KOLEKSI_GURU
      );

      const snapshot = await F.getDocs(ref);

      data = snapshot.docs.map((dok) => ({
        ...dok.data(),
        id: dok.id
      }));

      await muatMapel();

      gambar();

    } catch (error) {
      console.error("Gagal memuat guru:", error);

      peringatan(
        "Gagal mengambil data guru dari Firebase."
      );

      toast("Koneksi Firebase bermasalah.");

    } finally {
      sedangMemuat = false;
    }
  }

  /* =========================================
     FIREBASE: SIMPAN DATA GURU
  ========================================= */

  // Mengembalikan { mapelDitambah, mapelGagal }.
  // Dokumen guru DIGABUNG (merge), bukan diganti utuh, sehingga field milik
  // halaman lain (akunEmail, akunSandi, akunAktif, akunProyek, dst.) tidak hilang.
  // Guru dan mapel baru disimpan dalam satu batch. Bila batch itu ditolak
  // (mis. aturan Firestore belum mengizinkan Daftar/mapel), guru tetap
  // disimpan tanpa mapel dan alasannya dikembalikan di mapelGagal.
  async function simpanFirebase(item, idLama = null) {
    const idBaru = String(item.id).trim();

    if (!idBaru) {
      throw new Error("NIP/ID guru wajib diisi.");
    }

    const baru = mapelBaru(item.mengajar.map((x) => x.mapel));
    const pindahId = !!idLama && idLama !== idBaru;
    const lama = idLama ? data.find((d) => d.id === idLama) : null;

    const susun = (denganMapel) => {
      const batch = F.writeBatch(dbSiswaGuru);

      // Jika NIP/ID diganti, bawa semua field lama ke dokumen baru
      // (kecuali field format lama mapel/kelas berupa teks).
      let dasar = {};
      if (pindahId && lama) {
        dasar = { ...lama };
        delete dasar.mapel;
        delete dasar.kelas;
        delete dasar.diperbaruiPada;
      }

      const isi = {
        ...dasar,
        ...item,
        id: idBaru,
        diperbaruiPada: F.serverTimestamp()
      };

      // Buang field format lama bila deleteField tersedia di firebase-pusat.js.
      // Jika tidak, field itu dibiarkan: tidak berbahaya karena
      // ambilMengajar() memprioritaskan array "mengajar".
      if (typeof F.deleteField === "function") {
        isi.mapel = F.deleteField();
        isi.kelas = F.deleteField();
      }

      if (pindahId) {
        batch.delete(F.doc(dbSiswaGuru, KOLEKSI_GURU, idLama));
      }

      // merge: true -> field lain di dokumen tidak tersentuh.
      batch.set(F.doc(dbSiswaGuru, KOLEKSI_GURU, idBaru), isi, { merge: true });

      if (denganMapel) tulisMapelKeBatch(batch, baru);

      return batch;
    };

    try {
      await susun(true).commit();
      catatMapel(baru);

      return { mapelDitambah: baru.length, mapelGagal: "" };

    } catch (errGabungan) {
      // Tidak ada mapel baru: masalahnya pada data guru itu sendiri.
      if (!baru.length) throw errGabungan;

      console.error("Batch guru + mapel ditolak:", errGabungan);

      await susun(false).commit();

      return { mapelDitambah: 0, mapelGagal: alasanGalat(errGabungan) };
    }
  }

  /* =========================================
     FILTER KELAS
  ========================================= */

  function semuaKelas() {
    return [
      ...new Set(
        data.flatMap((d) =>
          ambilMengajar(d).flatMap((x) => x.kelas)
        )
      )
    ].sort(urutKelas);
  }

  function isiPilihan() {
    const fk = $("fk");

    if (!fk) return;

    const sebelumnya = fk.value;
    const kelas = semuaKelas();

    fk.innerHTML =
      '<option value="">Semua kelas</option>' +
      kelas.map((k) =>
        `<option value="${esc(k)}">${esc(k)}</option>`
      ).join("");

    fk.value = kelas.includes(sebelumnya)
      ? sebelumnya
      : "";

    const dk = $("dk");

    if (dk) {
      dk.innerHTML = kelas.map((k) =>
        `<option value="${esc(k)}"></option>`
      ).join("");
    }
  }

  /* =========================================
     PENCARIAN
  ========================================= */

  function tersaring() {
    const q = $("cari").value.trim().toLowerCase();
    const fk = $("fk").value;

    return data
      .filter((d) =>
        !fk || ambilMengajar(d).some((x) => x.kelas.includes(fk))
      )
      .filter((d) =>
        !q ||
        CARI.some((k) =>
          String(d[k] || "").toLowerCase().includes(q)
        ) ||
        ambilMengajar(d).some((x) =>
          x.mapel.toLowerCase().includes(q)
        )
      )
      .sort((a, b) =>
        urut(a.nama || "", b.nama || "")
      );
  }

  /* =========================================
     TABEL
  ========================================= */

  function lencanaMengajar(d) {
    const arr = ambilMengajar(d);

    if (!arr.length) return '<span style="color:var(--redup)">–</span>';

    return arr.map((x) =>
      `<span class="lencana"><b>${esc(x.mapel)}</b> · ${esc(x.kelas.join(", ") || "tanpa kelas")}</span>`
    ).join("");
  }

  function gambar() {
    isiPilihan();

    const daftar = tersaring();

    const adaFilter =
      $("cari").value.trim() || $("fk").value;

    $("jml").textContent = adaFilter
      ? `${daftar.length} dari ${data.length} guru`
      : `${data.length} guru terdaftar`;

    const jumlahMapel = new Set(
      data.flatMap((d) =>
        ambilMengajar(d).map((x) => x.mapel.toLowerCase())
      )
    ).size;

    $("rinci").textContent =
      `${jumlahMapel} mata pelajaran · ${semuaKelas().length} kelas`;

    $("tb").innerHTML = daftar.length
      ? daftar.map((d) => `
          <tr>
            <td class="id" data-label="NIP / ID">${esc(d.id)}</td>
            <td data-label="Nama">${esc(d.nama)}</td>
            <td data-label="Mengajar">${lencanaMengajar(d)}</td>

            <td class="aksi">
              <button
                type="button"
                class="kecil"
                data-aksi="ubah"
                data-id="${esc(d.id)}">
                Ubah
              </button>

              <button
                type="button"
                class="kecil bahaya"
                data-aksi="hapus"
                data-id="${esc(d.id)}">
                Hapus
              </button>
            </td>
          </tr>
        `).join("")
      : `
          <tr>
            <td colspan="4" class="kosong">
              ${
                data.length
                  ? "Tidak ada data yang cocok."
                  : "Belum ada data guru."
              }
            </td>
          </tr>
        `;
  }

  /* =========================================
     FORM
  ========================================= */

  function bukaForm(item = null) {
    idDiedit = item ? item.id : null;

    $("jdl").textContent = item
      ? "Ubah Data Guru"
      : "Tambah Guru";

    $("isi").innerHTML = BIDANG_FORM.map((b) => {
      if (b.area) {
        const nilai = item ? teksMengajar(ambilMengajar(item)) : "";

        return `
          <label class="f">
            <span>${esc(b.l)} *</span>
            <textarea
              name="${b.k}"
              rows="4"
              required
              placeholder="IPA: IX A, IX B&#10;Matematika: VIII A">${esc(nilai)}</textarea>
            <small>Satu baris per mata pelajaran. Format: Mapel: kelas, kelas</small>
          </label>
        `;
      }

      return `
        <label class="f">
          <span>${esc(b.l)} *</span>
          <input
            name="${b.k}"
            type="text"
            autocomplete="off"
            required
            value="${esc(item ? item[b.k] : "")}"
          >
        </label>
      `;
    }).join("");

    $("gf").classList.add("hidden");
    $("dlg").showModal();
    $("frm").elements[0].focus();
  }

  function galat(pesan) {
    $("gf").textContent = pesan;
    $("gf").classList.remove("hidden");
  }

  async function kirimForm(e) {
    e.preventDefault();

    if (sedangMemuat) return;

    const tombol = $("frm").querySelector(
      '[type="submit"]'
    );

    if (tombol) tombol.disabled = true;

    try {
      const baru = {};

      for (const b of BIDANG_FORM) {
        baru[b.k] = String(
          $("frm").elements[b.k].value || ""
        ).trim();

        if (!baru[b.k]) {
          galat(`${b.l} wajib diisi.`);
          return;
        }
      }

      baru.id = baru.id.replace(/\s+/g, "");

      if (baru.id.includes("/")) {
        galat("NIP/ID guru tidak boleh memuat tanda /.");
        return;
      }

      baru.mengajar = pecahMengajar(baru.mengajar);

      if (
        !baru.mengajar.length ||
        baru.mengajar.some((x) => !x.kelas.length)
      ) {
        galat("Isi tiap baris dengan format  Mapel: kelas, kelas  (contoh: IPA: IX A, IX B).");
        return;
      }

      lengkapi(baru);

      const kembar = data.some((d) =>
        d.id === baru.id && d.id !== idDiedit
      );

      if (kembar) {
        galat("NIP/ID guru sudah terdaftar.");
        return;
      }

      const hasil = await simpanFirebase(baru, idDiedit);

      $("dlg").close();

      toast(
        (idDiedit
          ? "Data guru berhasil diperbarui."
          : "Data guru berhasil ditambahkan.") +
        (hasil.mapelGagal
          ? ` Tetapi daftar mapel gagal disimpan (${hasil.mapelGagal}). Periksa aturan Firestore untuk ${JALUR_MAPEL.join("/")}.`
          : hasil.mapelDitambah
            ? ` ${hasil.mapelDitambah} mapel baru masuk ke daftar mapel.`
            : "")
      );

      await muatGuru();

    } catch (error) {
      console.error(error);

      galat(
        "Gagal menyimpan data guru ke Firebase (" + alasanGalat(error) + ")."
      );

    } finally {
      if (tombol) tombol.disabled = false;
    }
  }

  /* =========================================
     HAPUS
  ========================================= */

  async function hapus(id) {
    const guru = data.find((d) => d.id === id);

    if (!guru) return;

    if (!(await konfirmasi(
      `Hapus guru ${guru.nama}?`,
      { judul: "Hapus guru", ya: "Hapus", bahaya: true }
    ))) return;

    try {
      const ref = F.doc(
        dbSiswaGuru,
        KOLEKSI_GURU,
        id
      );

      await F.deleteDoc(ref);

      // Cabut hak akses: hapus daftar akunGuru di KELIMA project, kalau tidak
      // guru yang sudah dihapus masih lolos Firestore Rules (isGuru()).
      const email = String(guru.akunEmail || "").toLowerCase();
      let gagalCabut = [];

      if (email) {
        const hasil = await Promise.allSettled(
          Object.values(FIREBASE_PUSAT).map((p) =>
            F.deleteDoc(F.doc(p.db, KOLEKSI.akunGuru || "akunGuru", email)))
        );
        gagalCabut = hasil.filter((h) => h.status === "rejected").length;
      }

      try { (await import("../assets/js/cache.js")).hapusCache("guruRingkas"); } catch (e) { /* abaikan */ }

      toast(gagalCabut
        ? "Guru dihapus, tetapi akses gagal dicabut di " + gagalCabut + " project. Hapus manual di koleksi akunGuru."
        : "Data guru berhasil dihapus dan aksesnya dicabut.");

      await muatGuru();

    } catch (error) {
      console.error(error);
      toast("Gagal menghapus data guru.");
    }
  }

  /* =========================================
     SINKRON MAPEL
     Menyalin mapel dari semua guru yang sudah ada ke Daftar/mapel.
  ========================================= */

  async function sinkronMapel() {
    if (sedangMemuat) return;

    if (!data.length) {
      toast("Belum ada data guru.");
      return;
    }

    try {
      await muatMapel();

      const n = await simpanMapelTerpisah(
        data.flatMap((d) => ambilMengajar(d).map((x) => x.mapel))
      );

      toast(
        n
          ? `${n} mapel baru ditambahkan ke daftar mapel.`
          : "Daftar mapel sudah lengkap."
      );

    } catch (error) {
      console.error("Sinkron mapel:", error);
      toast("Gagal menyimpan koleksi mapel. Periksa aturan Firestore untuk " + JALUR_MAPEL.join("/") + ".");
    }
  }

  /* =========================================
     PEMBACA BERKAS: EXCEL (.xlsx/.xls) DAN CSV
  ========================================= */

  function parseCSV(teks) {
    teks = teks.replace(/^\uFEFF/, "");

    const baris1 = teks.split(/\r?\n/, 1)[0] || "";

    const pemisah =
      (baris1.match(/;/g) || []).length >
      (baris1.match(/,/g) || []).length
        ? ";"
        : ",";

    const hasil = [];
    let baris = [];
    let sel = "";
    let kutip = false;

    for (let i = 0; i < teks.length; i++) {
      const c = teks[i];

      if (kutip) {
        if (c === '"' && teks[i + 1] === '"') {
          sel += '"';
          i++;
        } else if (c === '"') {
          kutip = false;
        } else {
          sel += c;
        }
      } else if (c === '"') {
        kutip = true;
      } else if (c === pemisah) {
        baris.push(sel);
        sel = "";
      } else if (c === "\n" || c === "\r") {
        if (c === "\r" && teks[i + 1] === "\n") i++;

        baris.push(sel);
        hasil.push(baris);

        baris = [];
        sel = "";
      } else {
        sel += c;
      }
    }

    if (sel !== "" || baris.length) {
      baris.push(sel);
      hasil.push(baris);
    }

    return hasil.filter((r) =>
      r.some((x) => x.trim() !== "")
    );
  }

  function muatSkrip(src) {
    return new Promise((ok, gagal) => {
      const s = document.createElement("script");

      s.src = src;
      s.onload = ok;
      s.onerror = () => {
        s.remove();
        gagal(new Error("Gagal memuat " + src));
      };

      document.head.appendChild(s);
    });
  }

  let janjiXlsx = null;

  function pastikanXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX);

    if (!janjiXlsx) {
      janjiXlsx = (async () => {
        for (const src of SUMBER_XLSX) {
          try {
            await muatSkrip(src);
            if (window.XLSX) return window.XLSX;
          } catch (e) {
            console.warn(e.message);
          }
        }

        janjiXlsx = null;
        throw new Error("Pustaka Excel tidak dapat dimuat.");
      })();
    }

    return janjiXlsx;
  }

  // Mengembalikan tabel (array baris, tiap baris array teks).
  async function bacaTabel(berkas) {
    const nama = berkas.name.toLowerCase();

    if (/\.(xlsx|xls)$/.test(nama)) {
      const X = await pastikanXlsx();

      const buku = X.read(
        await berkas.arrayBuffer(),
        { type: "array" }
      );

      const namaSheet =
        buku.SheetNames.find((n) =>
          n.trim().toLowerCase() === SHEET_DATA.toLowerCase()
        ) || buku.SheetNames[0];

      const baris = X.utils.sheet_to_json(
        buku.Sheets[namaSheet],
        { header: 1, raw: false, defval: "" }
      );

      return baris
        .map((b) => b.map((x) => String(x ?? "").trim()))
        .filter((b) => b.some((x) => x !== ""));
    }

    return parseCSV(await berkas.text());
  }

  /* =========================================
     UNDUH TEMPLAT DAN IMPOR
  ========================================= */

  async function unduhTemplat() {
    try {
      const res = await fetch(URL_TEMPLAT, { cache: "no-cache" });

      if (!res.ok) throw new Error("HTTP " + res.status);

      const url = URL.createObjectURL(await res.blob());

      const a = document.createElement("a");

      a.href = url;
      a.download = NAMA_TEMPLAT;

      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1000);

    } catch (error) {
      console.error("Unduh templat:", error);

      toast(
        "Templat tidak ditemukan di assets/templat/" + NAMA_TEMPLAT + "."
      );
    }
  }

  async function imporBerkas(berkas) {
    if (!berkas) return;

    try {
      const tabel = await bacaTabel(berkas);

      if (tabel.length < 2) {
        toast("Berkas kosong atau hanya berisi judul kolom.");
        return;
      }

      const kepala = tabel[0].map(normKepala);
      const indeks = {};

      for (const b of BIDANG_IMPOR) {
        const i = kepala.findIndex((h) => b.alias.includes(h));

        if (i >= 0) indeks[b.k] = i;
      }

      const hilang = BIDANG_IMPOR.filter((b) =>
        b.wajib && !(b.k in indeks)
      );

      if (hilang.length) {
        toast(
          "Kolom wajib tidak ditemukan: " +
          hilang.map((b) => b.l).join(", ") + "."
        );
        return;
      }

      // Satu baris = satu penugasan. NIP yang sama digabung.
      const hasil = new Map();
      let dilewati = 0;

      for (const r of tabel.slice(1)) {
        const g = (k) => (k in indeks ? rapikan(r[indeks[k]]) : "");

        const id = g("id").replace(/\s+/g, "").replace(/^'/, "");
        const nama = g("nama");
        const mapel = g("mapel");
        const kelas = pecahKelas(g("kelas"));

        if (!id || id.includes("/") || !nama || !mapel || !kelas.length) {
          dilewati++;
          continue;
        }

        const guru = hasil.get(id) || { id, nama, mengajar: [] };

        let m = guru.mengajar.find(
          (x) => x.mapel.toLowerCase() === mapel.toLowerCase()
        );

        if (!m) {
          m = { mapel, kelas: [] };
          guru.mengajar.push(m);
        }

        kelas.forEach((k) => {
          if (!m.kelas.includes(k)) m.kelas.push(k);
        });

        hasil.set(id, guru);
      }

      hasil.forEach((guru) => {
        guru.mengajar.forEach((x) => x.kelas.sort(urutKelas));
        lengkapi(guru);
      });

      const daftar = [...hasil.values()];

      if (!daftar.length) {
        toast("Tidak ada baris yang valid untuk diimpor.");
        return;
      }

      const diperbarui = daftar.filter((item) =>
        data.some((d) => d.id === item.id)
      ).length;

      const baru = daftar.length - diperbarui;

      // Guru dan mapel disimpan bersama dalam batch yang sama
      // (mapel ditaruh paling depan agar ikut batch pertama).
      // Daftar mengajar guru di berkas menggantikan daftar lamanya.
      await muatMapel();

      const mapelTambah = mapelBaru(
        daftar.flatMap((g) => g.mengajar.map((x) => x.mapel))
      );

      const opsiMapel = mapelTambah.length
        ? [(batch) => tulisMapelKeBatch(batch, mapelTambah)]
        : [];

      const opsiGuru = daftar.map((item) => (batch) => {
        batch.set(
          F.doc(dbSiswaGuru, KOLEKSI_GURU, item.id),
          { ...item, diperbaruiPada: F.serverTimestamp() },
          { merge: true }
        );
      });

      const tulisSemua = async (operasi) => {
        for (let i = 0; i < operasi.length; i += 450) {
          const batch = F.writeBatch(dbSiswaGuru);

          operasi.slice(i, i + 450).forEach((jalankan) => jalankan(batch));

          await batch.commit();
        }
      };

      let mapelGagal = "";

      try {
        await tulisSemua([...opsiMapel, ...opsiGuru]);
        catatMapel(mapelTambah);
      } catch (errGabungan) {
        // Jika hanya mapel yang ditolak, guru tetap disimpan.
        // Bila guru juga gagal, galat aslinya dilempar ke catch luar.
        console.error("Batch guru + mapel ditolak:", errGabungan);

        await tulisSemua(opsiGuru);

        mapelGagal = alasanGalat(errGabungan);
      }

      peringatan("");

      toast(
        `Impor selesai: ${baru} guru baru, ${diperbarui} diperbarui, ${dilewati} baris dilewati. ` +
        (mapelGagal
          ? `Daftar mapel gagal disimpan (${mapelGagal}). Periksa aturan Firestore untuk ${JALUR_MAPEL.join("/")}.`
          : `${mapelTambah.length} mapel baru masuk ke daftar mapel.`)
      );

      await muatGuru();

    } catch (error) {
      console.error(error);
      const sebab = alasanGalat(error);

      peringatan("Impor gagal: " + sebab);
      toast("Gagal mengimpor berkas (" + sebab + ").");
    } finally {
      $("berkas").value = "";
    }
  }

  /* =========================================
     EVENT
  ========================================= */

  function mulai() {
    $("tambah").textContent = "Tambah Guru";

    $("cari").placeholder = "Cari nama, NIP, atau mapel";

    $("tambah").addEventListener(
      "click",
      () => bukaForm()
    );

    $("templat").addEventListener(
      "click",
      unduhTemplat
    );

    $("impor").addEventListener(
      "click",
      () => $("berkas").click()
    );

    $("sinkron").addEventListener(
      "click",
      sinkronMapel
    );

    $("berkas").addEventListener(
      "change",
      (e) => imporBerkas(e.target.files[0])
    );

    $("cari").addEventListener("input", gambar);
    $("fk").addEventListener("change", gambar);

    $("frm").addEventListener("submit", kirimForm);

    $("batal").addEventListener(
      "click",
      () => $("dlg").close()
    );

    $("tb").addEventListener("click", (e) => {
      const tombol = e.target.closest("[data-aksi]");

      if (!tombol) return;

      if (tombol.dataset.aksi === "ubah") {
        const item = data.find(
          (d) => d.id === tombol.dataset.id
        );

        if (item) bukaForm(item);
      } else {
        hapus(tombol.dataset.id);
      }
    });

    $("dlg").addEventListener("click", (e) => {
      if (e.target === $("dlg")) {
        $("dlg").close();
      }
    });

    if (galatMuat) {
      peringatan(galatMuat);
      $("jml").textContent = "Data tidak dapat dimuat";
      $("tb").innerHTML =
        '<tr><td colspan="4" class="kosong">Firebase belum terhubung.</td></tr>';
      return;
    }

    muatGuru();
  }

  mulai();

})();
</script>
