<!DOCTYPE html>
<html lang="id">
<head>
<script>document.documentElement.style.visibility='hidden'</script>
<script type="module" src="../assets/js/guard.js" data-peran="admin"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buat Token — KW Learning</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="../assets/templat/logo.jpeg">
<link rel="apple-touch-icon" href="../assets/templat/logo.jpeg">
<link rel="stylesheet" href="../assets/css/neumorph.css">
<link rel="stylesheet" href="../assets/css/sidebar.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
/* Halaman Buat Token · KW Learning
   Desain dasar ada di neumorph.css (dimuat lebih dulu). */

:root {
  --nm-base: var(--nm-bg);
  --nm-hi:   var(--nm-light);
  --nm-lo:   var(--nm-dark);
  --nm-ink:  var(--nm-text);
  --nm-soft: var(--nm-muted);
  --nm-line: var(--nm-garis);
  --nm-tint: color-mix(in srgb, var(--nm-text) 6%, var(--nm-bg));
}

/* Neumorphism hanya di dalam #mn, #toast, dan modal (.mo) */
#mn, #toast, .mo {
  --base: var(--nm-base);
  --hi: var(--nm-hi);
  --lo: var(--nm-lo);
  --card: var(--nm-base);
  --ink: var(--nm-ink);
  --soft: var(--nm-soft);
  --muted: var(--nm-soft);
  --navy: var(--nm-accent);
  --gold: var(--nm-accent);
  --line: var(--nm-line);
  --tint: var(--nm-tint);

  --out:    8px 8px 18px var(--lo), -8px -8px 18px var(--hi);
  --out-sm: 4px 4px 10px var(--lo), -4px -4px 10px var(--hi);
  --out-xs: 3px 3px 6px var(--lo),  -3px -3px 6px var(--hi);
  --in:     inset 5px 5px 10px var(--lo), inset -5px -5px 10px var(--hi);
  --in-sm:  inset 3px 3px 6px var(--lo),  inset -3px -3px 6px var(--hi);
  --shadow: var(--out);
  --shadow-lg: 12px 12px 26px var(--lo), -12px -12px 26px var(--hi);

  font-family: 'Poppins', system-ui, sans-serif;
}

#mn { margin-left: var(--sw); min-height: 100%; font-size: 14.5px; line-height: 1.6; color: var(--ink); }

#mn h1, #mn h2, #mn h3 { font-family: 'Poppins', system-ui, sans-serif; font-weight: 600; }

/* ---------- Layout ---------- */
#mn .top {
  display: flex; align-items: center; gap: 12px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 28px 16px;
  background: var(--base);
  box-shadow: 0 6px 14px -8px var(--lo);
  position: sticky; top: 0; z-index: 20;
}
#mn .top h2 {
  font-size: 21px; color: var(--ink); flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#mn #burger {
  display: none; border: 0; background: var(--base); border-radius: 12px;
  width: 44px; height: 44px; flex: none; font-size: 18px; color: var(--navy);
  box-shadow: var(--out-sm);
}
#mn #burger:active { box-shadow: var(--in-sm); }

/* Mepet sidebar, jarak kanan kecil */
#mn .wrap {
  max-width: none;
  margin: 0;
  padding: 24px 24px calc(70px + env(safe-area-inset-bottom, 0px));
  animation: naik .35s ease both;
}

/* ---------- Kartu ---------- */
#mn .card {
  background: var(--base); border: 0; border-radius: 24px;
  padding: 22px 24px; margin-bottom: 22px; box-shadow: var(--out);
}
#mn .card h3 {
  font-size: 17px; margin-bottom: 16px; color: var(--ink);
  display: flex; align-items: center; gap: 12px;
}
#mn .card h3::before {
  content: ""; width: 26px; height: 26px; border-radius: 50%;
  background: radial-gradient(circle, var(--navy) 0 28%, transparent 30%), var(--base);
  box-shadow: var(--out-xs); flex: none;
}

/* ---------- Statistik: maksimal 4 kolom, turun otomatis ---------- */
#mn .stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(210px, calc((100% - 3 * 20px) / 4)), 1fr));
  gap: 20px;
  margin-bottom: 22px;
}
#mn .st {
  background: var(--base); border-radius: 20px; padding: 18px 20px;
  box-shadow: var(--out); min-width: 0;
}
#mn .st b { display: block; font: 600 30px/1.15 'Poppins', sans-serif; color: var(--navy); }
#mn .st span { color: var(--soft); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }

/* ---------- Tombol ---------- */
#mn .btn {
  color: var(--navy); border: 0; background: var(--base); border-radius: 16px;
  padding: 11px 20px; font-weight: 600; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center;
  box-shadow: var(--out-sm); transition: box-shadow .18s, transform .18s;
}
#mn .btn:hover { transform: translateY(-1px); box-shadow: var(--out); }
#mn .btn:active { transform: none; box-shadow: var(--in-sm); }
#mn .btn.p, #mn .btn.g { color: var(--navy); background: var(--base); }
#mn .btn.d { color: var(--no); }
#mn .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: var(--out-xs); }

#mn .acts { display: flex; gap: 14px; flex-wrap: wrap; }
#mn .card > .acts { margin-top: 20px; }

/* ---------- Tabel ---------- */
#mn .tw {
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  border-radius: 20px; background: var(--base); box-shadow: var(--out);
}
#mn table { width: 100%; border-collapse: collapse; font-size: 14px; }
#mn th, #mn td {
  padding: 13px 16px; border-bottom: 1px solid var(--line);
  text-align: left; white-space: nowrap;
}
#mn th {
  background: transparent; color: var(--navy); font-size: 12px;
  letter-spacing: .06em; text-transform: uppercase; border-bottom: 2px solid var(--line);
}
#mn tbody tr:hover { background: color-mix(in srgb, var(--tint) 60%, transparent); }
#mn tr:last-child td { border-bottom: 0; }
#mn .tk { font-family: ui-monospace, Consolas, monospace; font-weight: 700; letter-spacing: 2px; color: var(--navy); }

#mn .badge {
  padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 700;
  background: var(--base); box-shadow: var(--in-sm);
}
#mn .badge.on  { color: var(--ok); }
#mn .badge.off { color: var(--no); }

/* ---------- Cari dan filter ---------- */
#mn .tools { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
#mn .tools input, #mn .tools select {
  padding: 14px 20px; border: 0; border-radius: 16px; background: var(--base);
  color: var(--ink); flex: 1; min-width: 150px; box-shadow: var(--in);
}
#mn .tools input:focus, #mn .tools select:focus {
  outline: none; box-shadow: var(--in), 0 0 0 2px color-mix(in srgb, var(--navy) 45%, transparent);
}
#mn .empty { padding: 28px; text-align: center; color: var(--soft); }

/* ---------- Pesan ---------- */
#mn .msg {
  border-radius: 16px; padding: 13px 18px; font-size: 14px; margin-bottom: 14px;
  background: var(--base); box-shadow: var(--in-sm); overflow-wrap: anywhere;
}
#mn .msg.err  { color: var(--no); border-left: 4px solid var(--no); }
#mn .msg.warn { color: var(--nm-warn); border-left: 4px solid #D9A21B; }

/* ---------- Toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%); background: var(--base); color: var(--navy);
  font-size: 14px; font-weight: 600; padding: 12px 24px; border-radius: 16px;
  z-index: 90; opacity: 0; pointer-events: none; transition: opacity .2s;
  max-width: calc(100% - 30px); text-align: center; box-shadow: var(--shadow-lg);
}
#toast.on { opacity: 1; }

/* ---------- Daftar paket dan pratinjau soal ---------- */
#mn .pk { display: flex; justify-content: space-between; gap: 14px; align-items: center; flex-wrap: wrap; }
#mn .pk b { color: var(--ink); font-size: 15.5px; }
#mn .pk small { color: var(--soft); display: block; word-break: break-all; }

#mn .prev { margin-top: 20px; padding: 6px 6px 6px 2px; max-height: 560px; overflow: auto; }
#mn .prev-sum { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 16px; }

#mn .chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
  border-radius: 99px; font-size: 12.5px; font-weight: 700;
  background: var(--base); color: var(--navy); box-shadow: var(--out-xs);
}
#mn .chip.ok   { color: var(--ok); }
#mn .chip.warn { color: var(--nm-warn); }

#mn .q {
  position: relative; padding: 16px 18px 16px 62px; margin-bottom: 16px;
  border-radius: 18px; background: var(--base); box-shadow: var(--out-sm);
  font-size: 14.5px; overflow-wrap: anywhere;
}
#mn .q .qn {
  position: absolute; left: 16px; top: 16px; width: 34px; height: 34px;
  border-radius: 50%; display: grid; place-items: center;
  font: 600 13.5px 'Poppins', sans-serif; color: var(--navy);
  background: var(--base); box-shadow: var(--in-sm);
}
#mn .q img { max-width: min(240px, 100%); height: auto; border-radius: 12px; }
#mn .q ol {
  list-style: none; margin: 10px 0 0; padding: 0; display: grid;
  grid-template-columns: 1fr 1fr; gap: 6px 16px; color: var(--soft);
}
#mn .q ol li { padding: 5px 10px; border-radius: 10px; }
#mn .q ol li.ok { box-shadow: var(--in-sm); color: var(--ok); font-weight: 700; }

#mn .kunci {
  margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 9px 14px; border-radius: 14px; background: var(--base);
  box-shadow: var(--in-sm); font-size: 13.5px; color: var(--soft);
}
#mn .kunci b.huruf {
  display: inline-grid; place-items: center; min-width: 30px; height: 30px;
  padding: 0 6px; border-radius: 50%; background: var(--base);
  box-shadow: var(--out-xs); color: var(--navy); font-size: 14px;
}
#mn .kunci.kosong { color: var(--no); }

/* ---------- Form tambah paket ---------- */
#mn .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
#mn .field label, #mn .source-panel label {
  display: block; font-size: 12px; font-weight: 600; color: var(--soft);
  margin: 0; letter-spacing: .05em; text-transform: uppercase;
}
#mn .field input, #mn .field select, #mn .source-panel input, #mn .source-panel select {
  width: 100%; min-width: 0; padding: 15px 20px; border: 0; border-radius: 16px;
  background: var(--base); color: var(--ink); font: inherit; font-size: 14px;
  box-shadow: var(--in);
}
#mn .field input:focus, #mn .field select:focus, #mn .source-panel input:focus {
  outline: none; box-shadow: var(--in), 0 0 0 2px color-mix(in srgb, var(--navy) 45%, transparent);
}
#mn .field input::placeholder, #mn .source-panel input::placeholder { color: var(--soft); opacity: .75; }

#mn .source-panel { margin-top: 14px; }
#mn .source-panel small { display: block; margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.5; }
#mn .source-badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px;
  border-radius: 20px; font-size: 11px; font-weight: 700;
  background: var(--base); color: var(--navy); box-shadow: var(--out-xs);
}

/* ---------- Modal pembuat token ---------- */
.mo {
  position: fixed; inset: 0; background: rgba(20,26,35,.45);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; z-index: 60;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
  font-family: 'Poppins', system-ui, sans-serif;
}
.mo .mb {
  background: var(--base); border-radius: 28px; padding: 28px 30px;
  width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto;
  overscroll-behavior: contain; position: relative;
  box-shadow: var(--shadow-lg); color: var(--ink); animation: naik .25s ease both;
}
.mo .mb h3 { font-size: 20px; color: var(--ink); font-family: 'Poppins', system-ui, sans-serif; font-weight: 600; }
.mo .mb p  { margin: 4px 0 8px; color: var(--soft); font-size: 14px; }
.mo .mb label {
  display: block; font-size: 12px; font-weight: 600; color: var(--soft);
  margin: 16px 0 8px; letter-spacing: .05em; text-transform: uppercase;
}
.mo .mb input {
  width: 100%; padding: 15px 20px; border: 0; border-radius: 16px;
  background: var(--base); color: var(--ink); font: inherit; font-size: 14px;
  box-shadow: var(--in);
}
.mo .mb input:focus {
  outline: none; box-shadow: var(--in), 0 0 0 2px color-mix(in srgb, var(--navy) 45%, transparent);
}
.mo .kinfo {
  font-size: 13px; line-height: 1.5; margin: 16px 0 0; padding: 12px 16px;
  border-radius: 16px; background: var(--base); color: var(--soft);
  box-shadow: var(--in-sm); overflow-wrap: anywhere;
}
.mo .kinfo.ok   { color: var(--ok); border-left: 4px solid var(--ok); }
.mo .kinfo.warn { color: var(--nm-warn); border-left: 4px solid #D9A21B; }
.mo .ma { display: flex; justify-content: flex-end; gap: 14px; margin-top: 24px; }

.mo .btn {
  color: var(--navy); border: 0; background: var(--base); border-radius: 16px;
  padding: 11px 20px; font-weight: 600; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center;
  box-shadow: var(--out-sm);
}
.mo .btn:hover { box-shadow: var(--out); }
.mo .btn:active { box-shadow: var(--in-sm); }
.mo .btn.p, .mo .btn.g { color: var(--navy); background: var(--base); }
.mo .btn.d { color: var(--no); }
.mo .btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: var(--out-xs); }

/* =====================================================
   RESPONSIVE
===================================================== */
@media (max-width: 820px) {
  #mn { margin-left: 0; }
  #mn #burger { display: block; }
  #mn .wrap { padding: 18px 14px calc(60px + env(safe-area-inset-bottom, 0px)); }
  #mn .top { padding-left: 16px; padding-right: 16px; }
  #mn .q ol { grid-template-columns: 1fr; }
}

@media (max-width: 600px) {
  #mn .top h2 { font-size: 18px; }
  #mn .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  #mn .st { padding: 13px; }
  #mn .st b { font-size: 23px; }
  #mn .st span { font-size: 11px; }
  #mn .card { padding: 18px; border-radius: 20px; }

  #mn .btn, .mo .btn { min-height: 44px; }

  #mn .tools { gap: 10px; }
  #mn .tools input, #mn .tools select { font-size: 16px; width: 100%; flex-basis: 100%; min-height: 44px; }
  #mn .field input, #mn .field select, #mn .source-panel input, #mn .source-panel select { font-size: 16px; min-height: 44px; }
  #mn .pk { align-items: flex-start; }
  #mn .pk .acts { width: 100%; }
  #mn .pk .btn { flex: 1; }
  #mn .prev { max-height: 60dvh; }
  #mn .q { padding: 14px; }
  #mn .q .qn { position: static; margin-bottom: 10px; }

  .mo { padding-left: 12px; padding-right: 12px; }
  .mo .mb { padding: 22px 18px; border-radius: 22px; }
  .mo .mb input { font-size: 16px; min-height: 44px; }
  .mo .ma { gap: 10px; }
  .mo .ma .btn { flex: 1 1 0; }
}

@media (max-width: 380px) {
  #mn .wrap { padding: 12px 10px calc(50px + env(safe-area-inset-bottom, 0px)); }
  #mn .stats { grid-template-columns: minmax(0, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
    scroll-behavior: auto !important;
  }
}
</style>

</head>

<body>

<!-- Sidebar dipasang seketika oleh js/sidebar-awal.js -->
<div id="sidebar-slot" data-mode="halaman" data-aktif="token"></div>
<script src="../assets/js/sidebar-awal.js"></script>

<div id="mn">

 <div class="top">
  <button id="burger" aria-label="Buka menu">☰</button>
  <h2 id="ttl">Buat Token</h2>
 </div>

 <div class="wrap">

  <div id="cfgwarn" class="msg warn hidden">
   <b>Ada masalah pada halaman ini.</b>
  </div>

  <div class="tools" id="perwrap" aria-label="Periode jadwal dan token"></div>

  <h3 style="margin:0 0 6px;color:var(--navy)">Pilih paket soal</h3>
  <p style="font-size:13px;color:var(--muted);margin:0 0 12px">
   Klik <b>Buat token</b> pada paket yang akan diujikan. Paket baru
   ditambahkan di halaman <a href="Banksoal.html">Tambah paket soal</a>.
  </p>

  <div id="pakets"></div>

  <h3 style="margin:22px 0 10px;color:var(--navy)">Daftar token</h3>

  <div class="tools">
   <input id="ftk" type="search"
    placeholder="Cari token atau nama ujian…">
  </div>
  <p id="hintTok" style="margin:6px 0 0;font-size:13px;color:var(--soft)"></p>

  <div class="tw">
   <table>
    <thead>
     <tr>
      <th>Token</th>
      <th>Ujian</th>
      <th>Waktu</th>
      <th>Status</th>
      <th>Dibuat</th>
      <th>Aksi</th>
     </tr>
    </thead>
    <tbody id="tb">
     <tr><td colspan="6" class="empty">Memuat…</td></tr>
    </tbody>
   </table>
  </div>

 </div>
</div>

<!-- MODAL TOKEN -->
<div class="mo hidden" id="mo">
 <div class="mb">
  <h3>Buat token ujian</h3>
  <p id="mnm"></p>

  <label for="mw">Waktu mengerjakan (menit)</label>
  <input id="mw" type="number" min="1" max="600" value="90">

  <label for="mt">Kode token</label>
  <input id="mt" maxlength="4" inputmode="numeric"
   style="font-family:ui-monospace,Consolas,monospace;letter-spacing:2px">

  <!-- Kunci jawaban dibaca otomatis dari dokumen Word -->
  <p id="mkinfo" class="kinfo"></p>

  <div id="merr" class="msg err hidden" style="margin-top:12px"></div>

  <div class="ma">
   <button class="btn" id="mc" type="button">Batal</button>
   <button class="btn p" id="ms" type="button">Simpan token</button>
  </div>
 </div>
</div>

<script type="module" src="../assets/js/token.js?v=7"></script>

</body>
</html>
